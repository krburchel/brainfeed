// ------------------------------------------------------------------
// Note actions (event delegation)
// ------------------------------------------------------------------
document.addEventListener('click', async (e) => {
  if (e.target.closest('[data-review]')) { openReview(); return; }
  const tagBtn = e.target.closest('[data-tag]');
  if (tagBtn && !e.target.closest('.board-picker')) { setFilter({ tag: tagBtn.dataset.tag }); return; }
  const f = e.target.closest('[data-filter]');
  if (f) { setFilter(f.dataset.filter === 'pinned' ? { pinned: true } : f.dataset.filter === 'archived' ? { archived: true } : f.dataset.filter === 'todo' ? { todo: true } : {}); return; }
  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;
  if (act === 'clear') { setFilter({}); return; }
  const card = actEl.closest('[data-id]');
  const id = card?.dataset.id;
  const note = findNote(id);
  if (act === 'zoom') { openLightbox(actEl.src); return; }
  if (act === 'open-parent') { openParent(actEl.dataset.parent); return; }
  if (!note) return;
  if (act === 'pin') {
    const pinned = !note.pinned;
    note.pinned = pinned; rerender();
    const { error } = await sb.from('notes').update({ pinned }).eq('id', id);
    if (error) { note.pinned = !pinned; rerender(); toast('Couldn\'t update: ' + error.message); }
  } else if (act === 'copy') {
    try { await navigator.clipboard.writeText(note.body); toast('Copied'); } catch { toast('Copy failed'); }
  } else if (act === 'remind') {
    compose.value = note.body.replace(/(^|\s)#[A-Za-z][\w-]*/g, '').trim(); autosize();
    setRemindMode(true); window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (act === 'edit') {
    state.editing = id; rerender();
  } else if (act === 'cancel') {
    state.editing = null; rerender();
  } else if (act === 'save') {
    await saveEdit(note);
  } else if (act === 'append') {
    state.appending = state.appending === id ? null : id; state.appendFocus = !!state.appending; rerender();
  } else if (act === 'append-cancel') {
    state.appending = null; rerender();
  } else if (act === 'append-save') {
    appendToNote(note, card.querySelector('[data-append]').value);
  } else if (act === 'toggle-kids') {
    if (state.expanded.has(id)) state.expanded.delete(id);
    else { await loadChildren(id); state.expanded.add(id); }
    rerender();
  } else if (act === 'move') {
    openMovePicker(note);
  } else if (act === 'take-out') {
    moveNote(note, null);
  } else if (act === 'archive') {
    archiveNote(note, !note.archived_at);
  } else if (act === 'delete') {
    deleteNote(note);
  }
});

// ------------------------------------------------------------------
// Review mode: go through notes one at a time (oldest-reviewed first) and
// Keep, Pin, Archive or set a reminder. reviewed_at is stored on the note, so
// a note reviewed on one device doesn't come up again on another for a week.
// ------------------------------------------------------------------
const REVIEW_AGAIN_DAYS = 7;
const REVIEW_MAX = 50;
function reviewQuery(scope, count = false) {
  const since = new Date(Date.now() - REVIEW_AGAIN_DAYS * 864e5).toISOString();
  let q = sb.from('notes').select(count ? 'id' : '*', count ? { count: 'exact', head: true } : undefined)
    .is('archived_at', null).or(`reviewed_at.is.null,reviewed_at.lt.${since}`);
  if (scope.tag) q = q.contains('tags', [scope.tag]);
  if (scope.todo) q = q.or('tags.cs.{todo},body.like.*[ ]*');
  if (!count) q = q.order('reviewed_at', { ascending: true, nullsFirst: true }).order('created_at', { ascending: true }).limit(REVIEW_MAX);
  return q;
}

async function openReview() {
  $('#menu').classList.add('hidden');
  const scopes = [
    { key: 'idea', label: '💡 Ideas', sub: '#idea', tag: 'idea' },
    { key: 'todo', label: '✅ To-dos', sub: '#todo and open checklists', todo: true },
    ...(state.tag && !['idea', 'todo'].includes(state.tag) ? [{ key: 't', label: '#' + state.tag, sub: 'the tag you\'re viewing', tag: state.tag }] : []),
    { key: 'all', label: '🗂️ Everything', sub: 'all notes, oldest first' },
  ];
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal review" role="dialog" aria-label="Review notes"><div id="rv"></div></div>`;
  document.body.appendChild(back);
  const box = back.querySelector('#rv');
  let queue = [], i = 0, history = [], tally = { kept: 0, pinned: 0, archived: 0, reminded: 0 }, picking = false;

  const close = () => { back.remove(); document.removeEventListener('keydown', onKey, true); if (history.length) { loadNotes(true); scheduleTagRefresh(); } };
  back.addEventListener('click', (e) => { if (e.target === back) close(); });

  // Step 1: choose what to review (with counts)
  box.innerHTML = `<h2>Review notes<span class="spacer"></span><button class="tool" data-rv="close" aria-label="Close">✕</button></h2>
    <p class="help">One note at a time: keep it, pin it, archive it or set a reminder. Notes you review won't come up again for ${REVIEW_AGAIN_DAYS} days.</p>
    <div class="scopes">${scopes.map((sc) => `<button data-scope="${sc.key}" disabled><span><strong>${esc(sc.label)}</strong><br><span style="font-size:12px;color:var(--muted)">${esc(sc.sub)}</span></span><span class="n" data-count="${sc.key}">…</span></button>`).join('')}</div>`;
  scopes.forEach(async (sc) => {
    const { count, error } = await reviewQuery(sc, true);
    const el = box.querySelector(`[data-count="${sc.key}"]`), btn = box.querySelector(`[data-scope="${sc.key}"]`);
    if (!el) return;
    el.textContent = error ? '–' : count ? `${count} to review` : 'all caught up';
    btn.disabled = !!error || !count;
  });

  async function start(sc) {
    box.innerHTML = '<p class="help">Loading…</p>';
    const { data, error } = await reviewQuery(sc);
    if (error) { box.innerHTML = `<p class="help">Couldn't load notes: ${esc(error.message)}</p>`; return; }
    queue = data; i = 0; draw();
  }

  function draw() {
    picking = false;
    if (i >= queue.length) return finish();
    const n = queue[i];
    const age = Math.max(0, Math.round((Date.now() - new Date(n.created_at)) / 864e5));
    box.innerHTML = `<h2>Review<span class="spacer"></span><span style="font-size:13px;color:var(--muted);font-weight:400;margin-right:8px">${i + 1} of ${queue.length}</span><button class="tool" data-rv="close" aria-label="Close">✕</button></h2>
      <div class="review-progress"><span style="width:${(i / queue.length) * 100}%"></span></div>
      <div class="review-card" id="rv-card"><div class="note-body">${renderBody(n.body)}</div>
        <div class="review-meta"><span>${age === 0 ? 'Added today' : age === 1 ? 'Added yesterday' : `Added ${age} days ago`}</span>${n.pinned ? '<span>📌 Pinned</span>' : ''}${n.reviewed_at ? `<span>Last reviewed ${dayLabel(n.reviewed_at)}</span>` : ''}</div></div>
      <div id="rv-when" class="review-when hidden">
        <button class="chip" data-when="tonight">Tonight 8pm</button><button class="chip" data-when="tomorrow">Tomorrow 9am</button>
        <button class="chip" data-when="monday">Monday 9am</button><button class="chip" data-when="week">In a week</button>
        <input class="field" type="datetime-local" id="rv-at" style="flex:1;min-width:180px"><button class="btn small" data-when="pick">Set</button>
      </div>
      <div class="review-actions">
        <button data-rv="archive">🗄️<span>Archive</span><kbd>A / ←</kbd></button>
        <button data-rv="remind">⏰<span>Remind me</span><kbd>R</kbd></button>
        <button data-rv="pin">📌<span>${n.pinned ? 'Unpin' : 'Pin'}</span><kbd>P</kbd></button>
        <button data-rv="keep" class="primary">👍<span>Keep</span><kbd>K / →</kbd></button>
      </div>
      <div class="review-foot"><button class="btn ghost small" data-rv="undo" ${history.length ? '' : 'disabled'}>Undo</button><span class="review-keys">U undo · Esc done</span><span class="review-swipe">Swipe ← archive · → keep</span><span class="spacer"></span><button class="btn ghost small" data-rv="close">Done</button></div>`;
    swipe(box.querySelector('#rv-card'));
  }

  function finish() {
    const t = tally, total = t.kept + t.pinned + t.archived + t.reminded;
    box.innerHTML = `<h2>${total ? 'Nice work 🎉' : 'All caught up'}<span class="spacer"></span><button class="tool" data-rv="close" aria-label="Close">✕</button></h2>
      <p class="help">${total ? `Reviewed ${total} note${total > 1 ? 's' : ''}: ${[t.kept && `${t.kept} kept`, t.pinned && `${t.pinned} pinned`, t.archived && `${t.archived} archived`, t.reminded && `${t.reminded} with a reminder`].filter(Boolean).join(', ')}.` : 'Nothing left to review here.'}</p>
      <div class="row" style="justify-content:flex-end;margin-top:12px">${history.length ? '<button class="btn ghost small" data-rv="undo">Undo last</button>' : ''}<button class="btn small" data-rv="close">Done</button></div>`;
  }

  // Each action saves, remembers how to undo, then moves on.
  async function act(kind, extra) {
    const n = queue[i]; if (!n) return;
    const prev = { reviewed_at: n.reviewed_at, pinned: n.pinned, archived_at: n.archived_at };
    const now = new Date().toISOString();
    const patch = { reviewed_at: now };
    if (kind === 'pin') patch.pinned = !n.pinned;
    if (kind === 'archive') patch.archived_at = now;
    let reminderId = null;
    if (kind === 'remind') {
      const body = (firstLine(n.body).replace(/(^|\s)#[A-Za-z][\w-]*/g, '').trim() || 'Review this note').slice(0, 2000);
      const { data, error } = await sb.from('reminders').insert({ body, due_at: extra.toISOString() }).select('id').single();
      if (error) { toast('Couldn\'t set the reminder: ' + error.message); return; }
      reminderId = data.id;
    }
    const { error } = await sb.from('notes').update(patch).eq('id', n.id);
    if (error) {
      if (reminderId) await sb.from('reminders').delete().eq('id', reminderId);
      toast('Couldn\'t save: ' + error.message); return;
    }
    Object.assign(n, patch);
    const key = { keep: 'kept', pin: 'pinned', archive: 'archived', remind: 'reminded' }[kind];
    tally[key]++;
    history.push({ note: n, prev, key, reminderId, index: i });
    if (kind === 'remind') { toast('Reminder set for ' + whenLabel(extra)); loadReminders(); }
    const card = box.querySelector('#rv-card');
    if (card) card.classList.add(kind === 'archive' ? 'gone-left' : 'gone-right');
    setTimeout(() => { i++; draw(); }, card ? 160 : 0);
  }

  async function undo() {
    const h = history.pop(); if (!h) return;
    const { error } = await sb.from('notes').update(h.prev).eq('id', h.note.id);
    if (error) { history.push(h); toast('Couldn\'t undo: ' + error.message); return; }
    if (h.reminderId) { await sb.from('reminders').delete().eq('id', h.reminderId); loadReminders(); }
    Object.assign(h.note, h.prev);
    tally[h.key]--;
    i = h.index; draw();
  }

  function remindAt(k) {
    const d = new Date();
    if (k === 'tonight') { d.setHours(20, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); }
    else if (k === 'tomorrow') { d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); }
    else if (k === 'monday') { d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); d.setHours(9, 0, 0, 0); }
    else if (k === 'week') { d.setDate(d.getDate() + 7); d.setHours(9, 0, 0, 0); }
    else if (k === 'pick') { const v = box.querySelector('#rv-at').value; if (!v) { toast('Pick a date and time.'); return null; } return new Date(v); }
    return d;
  }
  function showWhen() {
    picking = true;
    const w = box.querySelector('#rv-when'); w.classList.remove('hidden');
    const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0);
    box.querySelector('#rv-at').value = toLocalInput(d);
  }

  // Swipe on touch screens: left = archive, right = keep.
  function swipe(card) {
    let x0 = null, dx = 0;
    card.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') return; x0 = e.clientX; dx = 0; card.style.transition = 'none'; });
    card.addEventListener('pointermove', (e) => { if (x0 === null) return; dx = e.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`; });
    const end = () => {
      if (x0 === null) return;
      x0 = null; card.style.transition = ''; card.style.transform = '';
      if (dx < -90) act('archive'); else if (dx > 90) act('keep');
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  }

  box.addEventListener('click', (e) => {
    const sc = e.target.closest('[data-scope]');
    if (sc && !sc.disabled) { start(scopes.find((x) => x.key === sc.dataset.scope)); return; }
    const w = e.target.closest('[data-when]');
    if (w) { const d = remindAt(w.dataset.when); if (d) act('remind', d); return; }
    const b = e.target.closest('[data-rv]'); if (!b || b.disabled) return;
    const k = b.dataset.rv;
    if (k === 'close') close();
    else if (k === 'undo') undo();
    else if (k === 'remind') showWhen();
    else act(k);
  });
  // Keys work only while the review is open and you're not typing in a field.
  function onKey(e) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); return; }
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (!queue.length || i >= queue.length) { if (e.key.toLowerCase() === 'u') undo(); return; }
    const k = e.key.toLowerCase();
    const map = { a: 'archive', arrowleft: 'archive', k: 'keep', arrowright: 'keep', p: 'pin' };
    if (map[k]) { e.preventDefault(); e.stopPropagation(); act(map[k]); }
    else if (k === 'r') { e.preventDefault(); picking ? act('remind', remindAt('tomorrow')) : showWhen(); }
    else if (k === 'u') { e.preventDefault(); undo(); }
  }
  document.addEventListener('keydown', onKey, true);
}

async function archiveNote(note, archive, quiet = false) {
  const prev = note.archived_at;
  const archived_at = archive ? new Date().toISOString() : null;
  note.archived_at = archived_at;
  const idx = state.notes.findIndex((n) => n.id === note.id);
  if (idx >= 0 && !matchesFilter(note)) state.notes.splice(idx, 1);
  if (archive) for (const k in state.boardNotes) state.boardNotes[k] = state.boardNotes[k].filter((n) => n.id !== note.id);
  rerender();
  const { error } = await sb.from('notes').update({ archived_at }).eq('id', note.id);
  if (error) {
    note.archived_at = prev;
    toast('Couldn\'t ' + (archive ? 'archive' : 'unarchive') + ': ' + error.message);
    loadNotes(true); if (state.view === 'board') loadBoard();
    return;
  }
  scheduleTagRefresh();
  if (state.view === 'board' && !archive) loadBoard();
  if (!quiet) toast(archive ? 'Note archived' : 'Note moved back to your feed', 'Undo', async () => {
    await archiveNote(note, !archive, true);
    if (matchesFilter(note) && !state.notes.some((n) => n.id === note.id)) loadNotes(true);
  });
}

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'edit-text') {
    if (continueChecklist(e.target, e)) return;
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const n = findNote(state.editing); if (n) saveEdit(n); }
    if (e.key === 'Escape') { state.editing = null; rerender(); }
  }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#search').focus(); }
});

async function saveEdit(note) {
  const body = $('#edit-text').value.trim();
  state.editing = null;
  if (!body || body === note.body) { rerender(); return; }
  const old = note.body; note.body = body; note.tags = localTags(body); rerender();
  const { data, error } = await sb.from('notes').update({ body }).eq('id', note.id).select().single();
  if (error) { note.body = old; rerender(); toast('Couldn\'t save: ' + error.message); return; }
  replaceNote(data); scheduleTagRefresh();
  if (state.view === 'board') loadBoard();
}

async function appendToNote(note, raw) {
  const text = (raw || '').trim();
  if (!text) return;
  const stamp = '— ' + new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).replace(/\s/g, ' ');
  state.appending = null;
  // Optimistic display, then one atomic UPDATE in the database (so an
  // addition arriving from Hermes at the same moment isn't overwritten).
  const old = note.body;
  note.body = note.body.replace(/\s+$/, '') + '\n\n' + stamp + '\n' + text; rerender();
  const { data, error } = await sb.rpc('append_to_note', { p_note: note.id, p_stamp: stamp, p_text: text });
  if (error || !data?.length) { note.body = old; rerender(); toast('Couldn\'t add: ' + (error?.message || 'note not found')); return; }
  replaceNote(data[0]); scheduleTagRefresh();
}

async function moveNote(note, parentId) {
  const prev = note.parent_id;
  const { error } = await sb.from('notes').update({ parent_id: parentId }).eq('id', note.id);
  if (error) { toast(/cannot/i.test(error.message) ? error.message : 'Couldn\'t move: ' + error.message); return; }
  note.parent_id = parentId;
  if (prev && state.children[prev]) state.children[prev] = state.children[prev].filter((n) => n.id !== note.id);
  const i = state.notes.findIndex((n) => n.id === note.id);
  if (i >= 0 && !matchesFilter(note)) state.notes.splice(i, 1);
  if (!parentId && !state.notes.some((n) => n.id === note.id) && matchesFilter(note)) { state.notes.push(note); state.notes.sort((a, b) => b.created_at.localeCompare(a.created_at)); }
  if (parentId) { state.expanded.add(parentId); await loadChildren(parentId); }
  if (prev) await loadChildren(prev);
  await loadNestingInfo(state.notes);
  rerender();
  toast(parentId ? `Moved into "${state.parentTitles[parentId] || firstLine((findNote(parentId) || {}).body || '')}"` : 'Moved back to your feed', 'Undo', () => moveNote(note, prev));
}

async function openParent(parentId) {
  setFilter({});
  state.expanded.add(parentId);
  await loadChildren(parentId);
  rerender();
  setTimeout(() => document.querySelector(`#feed [data-id="${parentId}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400);
}

function openMovePicker(note) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-label="Move into a note">
    <h2>Move into…<span class="spacer"></span><button class="tool" data-pick-close aria-label="Close">✕</button></h2>
    <p class="help" style="margin:4px 0 10px;color:var(--muted);font-size:13px">Pick the note this one should live inside. It will leave your main feed and show under that note.</p>
    <input class="field" id="pick-q" placeholder="Search your notes…" autocomplete="off">
    <div class="picker-list" id="pick-list"></div>
  </div>`;
  document.body.appendChild(back);
  const close = () => back.remove();
  const load = async () => {
    const qtext = back.querySelector('#pick-q').value.trim();
    let q = sb.from('notes').select('id,body').is('parent_id', null).is('archived_at', null).neq('id', note.id).order('updated_at', { ascending: false }).limit(30);
    if (qtext) q = q.ilike('body', `%${qtext.replace(/[%_\\]/g, '\\$&')}%`);
    const { data } = await q;
    back.querySelector('#pick-list').innerHTML = (data || []).map((p) => `<button data-pick="${p.id}">${esc(firstLine(p.body) || '(empty note)')}</button>`).join('') || '<p style="color:var(--muted)">No notes found.</p>';
  };
  let t; back.querySelector('#pick-q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(load, 200); });
  back.addEventListener('click', (e) => {
    if (e.target === back || e.target.closest('[data-pick-close]')) { close(); return; }
    const p = e.target.closest('[data-pick]');
    if (p) { close(); moveNote(note, p.dataset.pick); }
  });
  load();
  back.querySelector('#pick-q').focus();
}

function deleteNote(note) {
  const idx = state.notes.findIndex((n) => n.id === note.id);
  state.notes = state.notes.filter((n) => n.id !== note.id); renderFeed();
  for (const k in state.boardNotes) state.boardNotes[k] = state.boardNotes[k].filter((n) => n.id !== note.id);
  for (const k in state.children) state.children[k] = state.children[k].filter((n) => n.id !== note.id);
  if (state.view === 'board') renderBoard(); else rerender();
  let undone = false;
  const del = sb.from('notes').delete().eq('id', note.id);
  del.then(({ error }) => { if (error) { toast('Couldn\'t delete: ' + error.message); loadNotes(true); } else scheduleTagRefresh(); });
  toast('Note deleted', 'Undo', async () => {
    undone = true;
    await del;
    const { _queued, ...row } = note;
    const { data, error } = await sb.from('notes').insert({ id: row.id, body: row.body, tags: row.tags, source: row.source, pinned: row.pinned, attachments: row.attachments, archived_at: row.archived_at ?? null, parent_id: row.parent_id ?? null, created_at: row.created_at }).select().single();
    if (error) { toast('Couldn\'t restore: ' + error.message); return; }
    state.notes.splice(Math.max(0, idx), 0, data); renderFeed(); scheduleTagRefresh();
    if (state.view === 'board') loadBoard();
  }, 7000);
  // Files are removed only after the undo window closes
  setTimeout(() => {
    if (undone || !(note.attachments || []).length) return;
    sb.storage.from(BUCKET).remove(note.attachments.map((a) => a.path));
  }, 7500);
}

function openLightbox(src) {
  const el = document.createElement('div');
  el.className = 'lightbox'; el.innerHTML = `<img src="${esc(src)}" alt="">`;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
}

function setFilter({ tag = null, pinned = false, archived = false, todo = false }) {
  state.tag = tag; state.pinned = pinned; state.archived = archived; state.todo = todo;
  if (state.view !== 'feed') switchView('feed');
  renderTags(); loadNotes(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let searchTimer;
$('#search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value.trim();
    if (state.view !== 'feed') switchView('feed');
    loadNotes(true);
  }, 250);
});

$('#load-more').onclick = () => loadNotes(false);

document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => switchView(t.dataset.view)));
function switchView(v) {
  state.view = v;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.view === v));
  $('#view-feed').classList.toggle('hidden', v !== 'feed');
  $('#view-board').classList.toggle('hidden', v !== 'board');
  $('#view-reminders').classList.toggle('hidden', v !== 'reminders');
  $('#view-calendar').classList.toggle('hidden', v !== 'calendar');
  applyTagBar();
  if (v === 'board') loadBoard();
  if (v === 'reminders') renderReminders();
  if (v === 'calendar') { renderCalendar(); loadCalendarNotes(); }
}

// Menu ---------------------------------------------------------------
$('#menu-btn').onclick = (e) => { e.stopPropagation(); $('#menu').classList.toggle('hidden'); };
document.addEventListener('click', (e) => { if (!e.target.closest('#menu')) $('#menu').classList.add('hidden'); });
$('#menu').addEventListener('click', async (e) => {
  const a = e.target.closest('[data-action]')?.dataset.action; if (!a) return;
  $('#menu').classList.add('hidden');
  if (a === 'review') {
    openReview();
  } else if (a === 'tagbar') {
    const m = TAGBAR_MODES[(TAGBAR_MODES.indexOf(tagBarMode()) + 1) % TAGBAR_MODES.length];
    lsSet(LS.tagbar, m); applyTagBar(); renderTags();
    toast(m === 'hidden' ? 'Tag bar hidden. Search #tag or tap a tag in a note to filter.' : `Tag bar: ${TAGBAR_LABELS[m]}`);
  } else if (a === 'theme') {
    const order = ['auto', 'light', 'dark'];
    lsSet(LS.theme, order[(order.indexOf(lsGet(LS.theme, 'auto')) + 1) % 3]); applyTheme();
  } else if (a === 'signout') {
    lsSet(LS.cache, null); await sb.auth.signOut();
  } else if (a === 'settings') {
    openSettings();
  } else if (a === 'export') {
    exportNotes();
  } else if (a === 'notify') {
    if (!('Notification' in window)) { toast('This browser doesn\'t support notifications. Hermes will cover reminders in step 2.'); return; }
    const p = await Notification.requestPermission();
    toast(p === 'granted' ? 'Alerts on: you\'ll be notified while BrainFeed is open.' : 'Notifications were blocked.');
  }
});

async function exportNotes() {
  const all = []; let from = 0;
  for (;;) {
    const { data, error } = await sb.from('notes').select(NOTE_SELECT).order('created_at').range(from, from + 999);
    if (error) { toast('Export failed: ' + error.message); return; }
    all.push(...data); if (data.length < 1000) break; from += 1000;
  }
  const { data: reminders } = await sb.from('reminders').select('*').order('due_at');
  const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), notes: all, reminders }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `brainfeed-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${all.length} notes`);
}

async function loadBoard() {
  const cols = state.settings?.board_tags || [];
  if (cols.length < 2) { state.boardPicking = true; state.pickTags = [...cols]; renderBoard(); return; }
  const results = await Promise.all(cols.map((t) => sb.from('notes').select(NOTE_SELECT).contains('tags', [t]).is('archived_at', null).order('pinned', { ascending: false }).order('created_at', { ascending: false }).limit(100)));
  cols.forEach((t, i) => { state.boardNotes[t] = results[i].data || []; });
  renderBoard();
}

function renderBoard() {
  const el = $('#view-board');
  const cols = state.settings?.board_tags || [];
  let html = `<div class="board-head"><h2>Board</h2><span class="spacer" style="flex:1"></span>${state.boardPicking ? '' : '<button class="btn ghost small" data-board="edit">Change columns</button>'}</div>`;
  if (state.boardPicking) {
    html += `<div class="board-picker"><p>Choose 2–5 tags to become columns. Notes with that tag show up in the column, and anything you add there gets the tag.</p>
      <div class="chips">${state.tags.length ? state.tags.map((t) => `<button class="chip${state.pickTags.includes(t.tag) ? ' on' : ''}" data-pick="${esc(t.tag)}">#${esc(t.tag)} <span style="opacity:.6">${t.count}</span></button>`).join('') : '<span style="color:var(--muted)">No tags yet. Add some #tags to notes first.</span>'}</div>
      <button class="btn small" data-board="save" ${state.pickTags.length < 2 ? 'disabled' : ''}>Save columns (${state.pickTags.length}/5)</button>
      ${cols.length >= 2 ? '<button class="btn ghost small" data-board="cancel">Cancel</button>' : ''}</div>`;
  } else {
    const mv = state.boardMoving;
    if (mv) html += `<div class="move-banner"><span>Tap a column to move "${esc(firstLine(mv.note.body).slice(0, 40))}" (or Archive)</span><button data-board="move-cancel">Cancel</button></div>`;
    const card = (n, t) => noteHtml(n, true)
      .replace('<article class="note', '<article draggable="true" class="note')
      .replace('<button class="tool" data-act="archive"', `<button class="tool" data-act="board-move" data-from="${esc(t)}" title="Move to another column">${ICON.move}</button><button class="tool" data-act="archive"`);
    html += `<div class="board${mv ? ' moving' : ''}">` + cols.map((t) => {
      const notes = state.boardNotes[t] || [];
      return `<div class="column" data-col="${esc(t)}"><h4>#${esc(t)} <span>${notes.length}</span></h4>
        <input class="field quick" data-quickadd="${esc(t)}" placeholder="Add to #${esc(t)}…">
        <div class="column-list">${notes.map((n) => card(n, t)).join('') || '<div class="empty" style="padding:24px 8px">Empty</div>'}</div></div>`;
    }).join('') + `<div class="column archive-zone" data-col="__archive">${ICON.archive}<div><strong>Archive</strong><br>Drop a card here to archive it</div></div></div>`;
  }
  withAddFocus(() => { el.innerHTML = html; });
  hydrateAttachments(el);
}

$('#view-board').addEventListener('click', async (e) => {
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    const t = pick.dataset.pick, i = state.pickTags.indexOf(t);
    if (i >= 0) state.pickTags.splice(i, 1); else if (state.pickTags.length < 5) state.pickTags.push(t); else toast('Up to 5 columns');
    renderBoard(); return;
  }
  const b = e.target.closest('[data-board]')?.dataset.board;
  if (b === 'move-cancel') { state.boardMoving = null; renderBoard(); return; }
  if (state.boardMoving && !b) {
    const col = e.target.closest('[data-col]');
    if (col) { const { note, from } = state.boardMoving; state.boardMoving = null; moveCardToColumn(note, from, col.dataset.col); return; }
  }
  const mvBtn = e.target.closest('[data-act="board-move"]');
  if (mvBtn) {
    const note = findNote(mvBtn.closest('[data-id]').dataset.id);
    if (note) { state.boardMoving = { note, from: mvBtn.dataset.from }; renderBoard(); }
    return;
  }
  if (b === 'edit') { state.boardPicking = true; state.pickTags = [...(state.settings.board_tags || [])]; renderBoard(); }
  else if (b === 'cancel') { state.boardPicking = false; renderBoard(); }
  else if (b === 'save') {
    const { data, error } = await sb.from('settings').update({ board_tags: state.pickTags, updated_at: new Date().toISOString() }).eq('user_id', state.user.id).select().single();
    if (error) { toast('Couldn\'t save columns: ' + error.message); return; }
    state.settings = data; state.boardPicking = false; loadBoard();
  }
});
// Move a board card from one tag column to another. If the old tag is
// written in the text (#grocery), swap it there so it stays changed after
// future edits; otherwise swap it in the tag list.
async function moveCardToColumn(note, from, to) {
  if (to === '__archive') { await archiveNote(note, true); loadBoard(); return; }
  if (!from || from === to) { renderBoard(); return; }
  const before = { body: note.body, tags: [...note.tags] };
  const esc_ = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(^|[^&\\w])#${esc_(from)}(?![\\w-])`, 'gi');
  let patch;
  if (re.test(note.body)) {
    const hasTo = new RegExp(`(^|[^&\\w])#${esc_(to)}(?![\\w-])`, 'i').test(note.body);
    let first = true;
    const body = note.body.replace(re, (m, pre) => { if (first && !hasTo) { first = false; return `${pre}#${to}`; } return pre; })
      .replace(/[ \t]{2,}/g, ' ').replace(/[ \t]+$/gm, '').trim();
    patch = { body };
  } else {
    patch = { tags: [...new Set(note.tags.filter((t) => t !== from).concat(to))] };
  }
  // Optimistic: move the card between columns right away
  state.boardNotes[from] = (state.boardNotes[from] || []).filter((n) => n.id !== note.id);
  if (!(state.boardNotes[to] || []).some((n) => n.id === note.id)) (state.boardNotes[to] ||= []).unshift({ ...note, ...patch, tags: [...new Set([...(patch.tags || note.tags.filter((t) => t !== from)), to])] });
  renderBoard();
  let { data, error } = await sb.from('notes').update(patch).eq('id', note.id).select().single();
  // A manual copy of the old tag can survive a text swap; drop it too.
  if (!error && data.tags.includes(from) && patch.body) {
    ({ data, error } = await sb.from('notes').update({ tags: data.tags.filter((t) => t !== from).concat(data.tags.includes(to) ? [] : [to]) }).eq('id', note.id).select().single());
  }
  if (error) { toast('Couldn\'t move: ' + error.message); loadBoard(); return; }
  replaceNote(data); scheduleTagRefresh(); loadBoard();
  if (data.tags.includes(from)) {
    toast(`Still under #${from}: the note starts with the word "${from}", which files it there automatically`);
  } else {
    toast(`Moved to #${to}`, 'Undo', async () => {
      await sb.from('notes').update({ body: before.body }).eq('id', note.id);
      await sb.from('notes').update({ tags: before.tags }).eq('id', note.id);
      scheduleTagRefresh(); loadBoard(); loadNotes(true);
    });
  }
}

function agoLabel(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  if (m < 1440) return `${Math.round(m / 60)} h ago`;
  return new Date(iso).toLocaleDateString();
}

function renderRemViews() {

function whenLabel(d) {
  d = new Date(d);
  const now = new Date(), t = timeLabel(d);
  const day = dayLabel(d);
  const diffDays = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date(now).setHours(0, 0, 0, 0)) / 864e5);
  if (diffDays === 0) return `Today ${t}`;
  if (diffDays === 1) return `Tomorrow ${t}`;
  if (diffDays === -1) return `Yesterday ${t}`;
  if (diffDays > 1 && diffDays < 7) return `${d.toLocaleDateString(undefined, { weekday: 'long' })} ${t}`;
  return `${diffDays < 0 ? day : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' })} ${t}`;
}
const REPEAT_LABEL = { daily: 'Every day', weekdays: 'Weekdays', weekly: 'Every week', monthly: 'Every month', yearly: 'Every year', dates: 'Specific dates' };

function nextOccurrence(due, repeat, dates) {
  if (repeat === 'dates') {
    const after = Math.max(Date.now(), new Date(due).getTime());
    return (dates || []).map((d) => new Date(d)).sort((a, b) => a - b).find((d) => d.getTime() > after) || null;
  }
  const d = new Date(due), now = new Date();
  do {
    if (repeat === 'daily') d.setDate(d.getDate() + 1);
    else if (repeat === 'weekdays') { do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6); }
    else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
    else if (repeat === 'monthly') {
      const day = new Date(due).getDate();
      d.setDate(1); d.setMonth(d.getMonth() + 1);
      d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    } else if (repeat === 'yearly') d.setFullYear(d.getFullYear() + 1);
    else break;
  } while (d <= now);
  return d;
}

function renderReminders() {

let calTimer = null;

// Move a reminder to another day, keeping its time of day. For repeating
// reminders this shifts the whole series to start from the new day.
async function moveReminderToDay(r, key) {
  state.cal.moving = null;
  const old = new Date(r.due_at), d = keyToDate(key);
  d.setHours(old.getHours(), old.getMinutes(), 0, 0);
  if (dayKey(old) === key) { renderCalendar(); return; }
  const prev = r.due_at;
  r.due_at = d.toISOString(); state.cal.selected = key; renderRemViews();
  const { error } = await sb.from('reminders').update({ due_at: r.due_at }).eq('id', r.id);
  if (error) { r.due_at = prev; renderRemViews(); toast('Couldn\'t move: ' + error.message); return; }
  toast(`Moved to ${whenLabel(d)}${d <= new Date() ? ' (that time has passed, so it\'s due now)' : ''}`, 'Undo', async () => {
    await sb.from('reminders').update({ due_at: prev }).eq('id', r.id); loadReminders();
  });
  loadReminders();
}

function startMove(r) {
  if (state.view !== 'calendar') {
    state.cal.selected = dayKey(new Date(r.due_at));
    const sel = keyToDate(state.cal.selected); state.cal.month = new Date(sel.getFullYear(), sel.getMonth(), 1);
    state.cal.moving = r; switchView('calendar'); return;

// Drag & drop (desktop): drag a reminder from the day list onto a day.
document.addEventListener('dragstart', (e) => {

document.addEventListener('dragover', (e) => {

const pad2 = (x) => String(x).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const keyToDate = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };

function calRange() {
  if (state.cal.mode === 'week') {
    const start = keyToDate(state.cal.selected); start.setDate(start.getDate() - start.getDay());
    const end = new Date(start); end.setDate(end.getDate() + 7);
    return { start, end };
  }
  const m = state.cal.month;
  const start = new Date(m.getFullYear(), m.getMonth(), 1);
  start.setDate(start.getDate() - start.getDay());           // back to Sunday
  const end = new Date(start); end.setDate(end.getDate() + 42); // 6 weeks
  return { start, end };
}

// Occurrences of a reminder between from and to, in local time, using the
// same rules as the server (anchored to the original date; month-end clamps).
function occurrences(r, from, to) {
  if (r.repeat === 'dates') return (r.dates || []).map((d) => new Date(d)).filter((d) => d >= from && d < to);
  const d0 = new Date(r.due_at);
  if (!r.repeat || r.done) return d0 >= from && d0 < to ? [d0] : [];
  const at = (k) => {
    const y = d0.getFullYear(), mo = d0.getMonth(), d = d0.getDate(), h = d0.getHours(), mi = d0.getMinutes();
    if (r.repeat === 'daily' || r.repeat === 'weekdays') {
      const x = new Date(y, mo, d + k, h, mi);
      return r.repeat === 'weekdays' && (x.getDay() === 0 || x.getDay() === 6) ? null : x;
    }
    if (r.repeat === 'weekly') return new Date(y, mo, d + 7 * k, h, mi);
    const months = r.repeat === 'monthly' ? k : 12 * k;
    const first = new Date(y, mo + months, 1, h, mi);
    first.setDate(Math.min(d, new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate()));
    return first;
  };
  const days = Math.floor((from - d0) / 864e5);
  let k = Math.max(0, r.repeat === 'weekly' ? Math.floor(days / 7) - 1
    : r.repeat === 'monthly' ? Math.floor(days / 31) - 1
    : r.repeat === 'yearly' ? Math.floor(days / 366) - 1 : days - 1);
  const out = [];
  for (let n = 0; n < 400; n++, k++) {
    const x = at(k);
    if (!x) continue;
    if (x >= to) break;
    if (x >= from && x >= d0) out.push(x);
  }
  return out;
}

async function loadCalendarNotes() {
  if (!state.cal.month) return;
  const { start, end } = calRange();
  const { data } = await sb.from('notes').select(NOTE_SELECT).is('archived_at', null)
    .gte('created_at', start.toISOString()).lt('created_at', end.toISOString()).order('created_at').limit(2000);
  state.cal.notes = data || [];
  if (state.view === 'calendar') renderCalendar();
}

function renderCalendar() {
  if (!state.cal.month) { const t = new Date(); state.cal.month = new Date(t.getFullYear(), t.getMonth(), 1); state.cal.selected = dayKey(t); }
  const { start, end } = calRange();
  const now = new Date(), todayKey = dayKey(now), month = state.cal.month.getMonth();
  const rems = {}, notes = {};
  for (const r of state.reminders) {
    for (const at of occurrences(r, start, end)) {
      (rems[dayKey(at)] ||= []).push({ r, at, real: at.getTime() === new Date(r.due_at).getTime() });
    }
  }
  for (const n of state.cal.notes) (notes[dayKey(new Date(n.created_at))] ||= []).push(n);
  // A specific date is finished once the reminder has moved past it (sent or checked off).
  const isPast = (x) => x.r.repeat === 'dates' && !x.real && (x.r.done || x.at < new Date(x.r.due_at));

  let grid = '';
  if (state.cal.mode === 'week') {
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const k = dayKey(d), rs = (rems[k] || []).sort((a, b) => a.at - b.at), ns = notes[k] || [];
      grid += `<div class="week-day${k === todayKey ? ' today' : ''}${k === state.cal.selected ? ' selected' : ''}" data-day="${k}">
        <h5>${esc(d.toLocaleDateString(undefined, { weekday: 'short' }))}<b>${d.getDate()}</b></h5>
        ${rs.map((x) => `<div class="wk-item${x.r.done || isPast(x) ? ' done' : !x.real ? ' proj' : x.at <= now ? ' over' : ''}"><span class="t">${esc(timeLabel(x.at))}</span>${esc(x.r.body)}</div>`).join('')}
        ${ns.length ? `<div class="wk-notes">✎ ${ns.length} note${ns.length > 1 ? 's' : ''}</div>` : ''}
      </div>`;
    }
  } else {
  grid = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const k = dayKey(d), rs = rems[k] || [], ns = notes[k] || [];
    const open = rs.filter((x) => !x.r.done), over = open.some((x) => x.real && x.at <= now);
    const cls = ['cal-day', d.getMonth() !== month && 'other', k === todayKey && 'today', k === state.cal.selected && 'selected'].filter(Boolean).join(' ');
    grid += `<button class="${cls}" data-day="${k}" aria-label="${esc(d.toDateString())}"><span class="num">${d.getDate()}</span><span class="cal-dots">`
      + (rs.length ? `<span class="cal-dot r${over ? ' over' : open.length ? '' : ' done'}" title="Reminders">⏰${rs.length}</span>` : '')
      + (ns.length ? `<span class="cal-dot n" title="Notes">✎${ns.length}</span>` : '')
      + '</span></button>';
  }
  }

  const sel = state.cal.selected, selDate = keyToDate(sel);
  const dayRems = (rems[sel] || []).sort((a, b) => a.at - b.at);
  const dayNotes = notes[sel] || [];
  const remRows = dayRems.map((x) => ({ ...x, past: isPast(x) })).map(({ r, at, real, past }) => real ? remHtml(r).replace('<div class="rem', `<div draggable="${!r.done && r.repeat !== 'dates'}" class="rem`)
    : `<div class="rem projected"><div class="rem-main"><div class="rem-text">${formatBody(r.body)}</div>
        <div class="rem-when"><span>${esc(timeLabel(at))}</span><span class="src">${r.repeat === 'dates' ? (past ? '✓ done' : 'scheduled date') : '↻ ' + REPEAT_LABEL[r.repeat]}</span></div></div></div>`).join('');
  const label = selDate.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: selDate.getFullYear() === now.getFullYear() ? undefined : 'numeric' });

  $('#view-calendar').innerHTML = `<div class="cal-wrap">
    <div>
      ${state.cal.moving ? `<div class="move-banner"><span>Tap a day to move "${esc(state.cal.moving.body.slice(0, 40))}"</span><button data-cal="move-cancel">Cancel</button></div>` : ''}
      <div class="cal-head">
        <button class="icon-btn" data-cal="prev" aria-label="Previous">‹</button>
        <h2>${esc(state.cal.mode === 'week'
          ? `${start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${new Date(end - 864e5).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`
          : state.cal.month.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</h2>
        <span class="cal-modes"><button data-cal="mode-month" class="${state.cal.mode === 'month' ? 'on' : ''}">Month</button><button data-cal="mode-week" class="${state.cal.mode === 'week' ? 'on' : ''}">Week</button></span>
        <button class="btn ghost small" data-cal="today">Today</button>
        <button class="icon-btn" data-cal="next" aria-label="Next">›</button>
      </div>
      <div class="${state.cal.mode === 'week' ? 'week' : 'cal-grid'}">${grid}</div>
    </div>
    <div class="cal-agenda">
      <h3>${esc(label)}<span class="spacer"></span><button class="btn small" data-cal="add">+ Reminder</button></h3>
      <h4>Reminders</h4>
      ${remRows || '<p style="color:var(--muted);margin:0">Nothing scheduled.</p>'}
      <h4>Notes</h4>
      ${dayNotes.map((n) => noteHtml(n, true)).join('') || '<p style="color:var(--muted);margin:0">No notes this day.</p>'}
    </div>
  </div>`;
  hydrateAttachments($('#view-calendar'));
}

$('#view-calendar').addEventListener('click', (e) => {
  const day = e.target.closest('[data-day]');
  if (day && state.cal.moving) { moveReminderToDay(state.cal.moving, day.dataset.day); return; }
  if (day) {
    state.cal.selected = day.dataset.day;
    const d = keyToDate(day.dataset.day);
    if (d.getMonth() !== state.cal.month.getMonth()) { state.cal.month = new Date(d.getFullYear(), d.getMonth(), 1); loadCalendarNotes(); }
    renderCalendar(); return;
  }
  const c = e.target.closest('[data-cal]')?.dataset.cal;
  if (c === 'move-cancel') { state.cal.moving = null; renderCalendar(); return; }
  if (c === 'mode-month' || c === 'mode-week') {
    state.cal.mode = c === 'mode-week' ? 'week' : 'month';
    const sel = keyToDate(state.cal.selected); state.cal.month = new Date(sel.getFullYear(), sel.getMonth(), 1);
    renderCalendar(); loadCalendarNotes(); return;
  }
  if ((c === 'prev' || c === 'next') && state.cal.mode === 'week') {
    const d = keyToDate(state.cal.selected); d.setDate(d.getDate() + (c === 'next' ? 7 : -7));
    state.cal.selected = dayKey(d); state.cal.month = new Date(d.getFullYear(), d.getMonth(), 1);
    renderCalendar(); loadCalendarNotes(); return;
  }
  if (c === 'prev' || c === 'next') {
    const m = state.cal.month;
    state.cal.month = new Date(m.getFullYear(), m.getMonth() + (c === 'next' ? 1 : -1), 1);
    renderCalendar(); loadCalendarNotes(); return;
  }
  if (c === 'today') {
    const t = new Date();
    state.cal.month = new Date(t.getFullYear(), t.getMonth(), 1); state.cal.selected = dayKey(t);
    renderCalendar(); loadCalendarNotes(); return;
  }
  if (c === 'add') {
    const d = keyToDate(state.cal.selected), now = new Date();
    d.setHours(9, 0, 0, 0);
    if (d <= now) { d.setTime(now.getTime() + 3600e3); d.setMinutes(0, 0, 0); }
    switchView('feed'); setRemindMode(true);
    $('#remind-at').value = toLocalInput(d);
    return;
  }
  if (e.target.closest('[data-rem-act]')) onReminderClick(e);
});

function checkDueReminders() {
  const alerted = lsGet(LS.alerted, {});
  const now = new Date();
  let changed = false;
  for (const r of state.reminders) {
    if (r.done || new Date(r.due_at) > now) continue;
    // Only alert for things that became due in the last 12 hours, once per occurrence
    if (now - new Date(r.due_at) > 12 * 3600e3 || alerted[r.id] === r.due_at) continue;
    alerted[r.id] = r.due_at; changed = true;
    toast('⏰ ' + r.body, 'Open', () => switchView('reminders'), 10000);
    try { if (Notification?.permission === 'granted') new Notification('BrainFeed reminder', { body: r.body, icon: 'icon-192.png', tag: r.id }); } catch {}
  }
  if (changed) lsSet(LS.alerted, alerted);
  loadReminders();
}

// ------------------------------------------------------------------
// Settings: time zone + connected agents (Hermes)
// ------------------------------------------------------------------
async function openSettings() {
  await loadAgents();
  const tz = state.settings?.timezone || 'UTC';
  let zones = [];
  try { zones = Intl.supportedValuesOf('timeZone'); } catch {}
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-label="Settings">
    <h2>Settings<span class="spacer"></span><button class="tool" data-set="close" aria-label="Close">✕</button></h2>
    <h3>Seasonal theme</h3>
    <p class="help">Colors, a header stripe and a little emoji that change on the 1st of each month. Applies on this device.</p>
    <div class="row">
      <select class="field" id="set-season">
        <option value="auto">Seasonal (changes monthly)</option>
        <option value="off">Off (classic purple)</option>
        ${MONTH_KEYS.map((k, i) => `<option value="${k}">Always ${esc(SEASONS[k].name)} ${SEASONS[k].emoji} (${new Date(2026, i, 1).toLocaleDateString(undefined, { month: 'short' })})</option>`).join('')}
      </select>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px"><input type="checkbox" id="set-fx"> Seasonal effects (snow, leaves, bats)</label>
    <h3>Time zone</h3>
    <p class="help">Used for reminder times, recurring reminders and what Hermes means by "9am".</p>
    <div class="row">
      <input class="field" id="set-tz" list="tz-list" value="${esc(tz)}" autocomplete="off">
      <datalist id="tz-list">${zones.map((z) => `<option value="${esc(z)}">`).join('')}</datalist>
      <button class="btn small" data-set="tz">Save</button>
    </div>
    <h3>Connected agents</h3>
    <p class="help">Paste the fingerprint Hermes gives you (it looks like <code>sha256:</code> followed by 64 characters). BrainFeed stores only the fingerprint; the real token never leaves your server.</p>
    <div class="row">
      <input class="field" id="agent-name" placeholder="Name" value="Hermes" style="flex:0 0 120px">
      <input class="field" id="agent-fp" placeholder="sha256:…" autocomplete="off" spellcheck="false">
      <button class="btn small" data-set="add">Connect</button>
    </div>
    <div id="agent-list" style="margin-top:12px"></div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#set-season').value = lsGet(LS.season, 'auto');
  back.querySelector('#set-fx').checked = lsGet(LS.seasonFx, true);
  back.querySelector('#set-season').addEventListener('change', (e) => { lsSet(LS.season, e.target.value); applyTheme(); renderFeed(); });
  back.querySelector('#set-fx').addEventListener('change', (e) => { lsSet(LS.seasonFx, e.target.checked); applySeason(); });
  const render = () => {
    back.querySelector('#agent-list').innerHTML = state.agents.length ? state.agents.map((t) => `
      <div class="agent${t.revoked_at ? ' revoked' : ''}" data-agent="${t.id}">
        <div class="info"><strong>${esc(t.name)}</strong> · ${t.revoked_at ? 'revoked' : t.last_used_at ? 'last used ' + esc(agoLabel(t.last_used_at)) : 'never used yet'}<br>
          <code>${esc(t.token_hash.slice(0, 19))}…${esc(t.token_hash.slice(-6))}</code> · added ${esc(new Date(t.created_at).toLocaleDateString())}</div>
        ${t.revoked_at ? '<button class="btn ghost small" data-set="remove">Remove</button>' : '<button class="btn ghost small" data-set="revoke" style="color:var(--danger)">Revoke</button>'}
      </div>`).join('') : '<p class="help">No agents connected.</p>';
  };
  render();
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); if (state.view === 'reminders') renderReminders(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('click', async (e) => {
    if (e.target === back) { close(); return; }
    const act = e.target.closest('[data-set]')?.dataset.set; if (!act) return;
    if (act === 'close') close();
    else if (act === 'tz') {
      const v = back.querySelector('#set-tz').value.trim();
      try { new Intl.DateTimeFormat('en-US', { timeZone: v }); } catch { toast('That isn\'t a valid time zone'); return; }
      const { data, error } = await sb.from('settings').update({ timezone: v, updated_at: new Date().toISOString() }).eq('user_id', state.user.id).select().single();
      if (error) { toast('Couldn\'t save: ' + error.message); return; }
      state.settings = data; toast('Time zone set to ' + v);
    } else if (act === 'add') {
      const fp = back.querySelector('#agent-fp').value.trim().toLowerCase();
      const name = back.querySelector('#agent-name').value.trim() || 'Hermes';
      if (!/^sha256:[0-9a-f]{64}$/.test(fp)) { toast('Fingerprint should be sha256: followed by 64 hex characters'); return; }
      const { error } = await sb.from('api_tokens').insert({ name, token_hash: fp });
      if (error) { toast(/duplicate/i.test(error.message) ? 'That fingerprint is already connected' : 'Couldn\'t connect: ' + error.message); return; }
      back.querySelector('#agent-fp').value = '';
      toast(name + ' connected. Tell Hermes to run its activation step.');
      await loadAgents(); render();
    } else if (act === 'revoke') {
      const id = e.target.closest('[data-agent]').dataset.agent;
      const { error } = await sb.from('api_tokens').update({ revoked_at: new Date().toISOString() }).eq('id', id);
      if (error) { toast('Couldn\'t revoke: ' + error.message); return; }
      toast('Revoked. That agent can no longer access BrainFeed.');
      await loadAgents(); render();
    } else if (act === 'remove') {
      const id = e.target.closest('[data-agent]').dataset.agent;
      await sb.from('api_tokens').delete().eq('id', id);
      await loadAgents(); render();
    }
  });
}

// ------------------------------------------------------------------
// Incoming notes from URL: iOS Shortcuts (?add=...) and the Android
// share sheet (?title=&text=&url=). Saves once, then cleans the URL.
// ------------------------------------------------------------------
async function handleIncoming() {
  const p = new URLSearchParams(location.search);
  const add = p.get('add');
  const shared = [p.get('title'), p.get('text'), p.get('url')].filter(Boolean);
  const body = (add || [...new Set(shared)].join('\n')).trim();
  if (!body) return;
  history.replaceState(null, '', location.pathname);
  await addNote(body, [], add ? (p.get('source') || 'shortcut') : 'share');
  toast('Saved to BrainFeed');
}

// ------------------------------------------------------------------
// Service worker
// ------------------------------------------------------------------
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
