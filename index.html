<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BrainFeed</title>
<meta name="description" content="The private feed for your brain. Capture anything, find it again.">
<meta name="theme-color" content="#6042e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BrainFeed">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f6f5fb;
  --surface: #ffffff;
  --surface-2: #efedf7;
  --border: #e2dff0;
  --text: #1c1a29;
  --muted: #6d6a80;
  --accent: #6042e8;
  --accent-soft: #ece8ff;
  --accent-text: #ffffff;
  --danger: #d6384b;
  --warn: #b86e00;
  --ok: #1d8a5c;
  --shadow: 0 1px 2px rgba(28, 26, 41, .06), 0 4px 16px rgba(28, 26, 41, .05);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121118; --surface: #1c1b25; --surface-2: #262433; --border: #33304a;
    --text: #ecebf5; --muted: #9a97b0; --accent: #8e76ff; --accent-soft: #2b2550;
    --accent-text: #120f26; --danger: #ff6b7c; --warn: #f0a640; --ok: #4fcf94;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121118; --surface: #1c1b25; --surface-2: #262433; --border: #33304a;
  --text: #ecebf5; --muted: #9a97b0; --accent: #8e76ff; --accent-soft: #2b2550;
  --accent-text: #120f26; --danger: #ff6b7c; --warn: #f0a640; --ok: #4fcf94;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* ---------- Auth ---------- */
#auth {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
}
.auth-card {
  width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 32px 24px; box-shadow: var(--shadow); text-align: center;
}
.auth-card img { width: 64px; height: 64px; border-radius: 16px; }
.auth-card h1 { margin: 12px 0 4px; font-size: 24px; }
.auth-card p { margin: 0 0 20px; color: var(--muted); }
.auth-card form { display: grid; gap: 10px; text-align: left; }
.field {
  width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); outline: none;
}
.field:focus { border-color: var(--accent); }
.btn {
  border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600;
  background: var(--accent); color: var(--accent-text);
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.auth-msg { min-height: 20px; font-size: 13px; color: var(--danger); margin-top: 4px; }
.auth-msg.ok { color: var(--ok); }

/* ---------- Shell ---------- */
header {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.header-row { display: flex; align-items: center; gap: 10px; max-width: 1180px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; flex-shrink: 0; }
.brand img { width: 28px; height: 28px; border-radius: 8px; }
.search { flex: 1; min-width: 0; position: relative; }
.search input { padding-left: 34px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative;
}
.icon-btn:hover { border-color: var(--accent); }
.tabs { display: flex; gap: 4px; max-width: 1180px; margin: 10px auto 0; }
.tab {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab.active { background: var(--accent-soft); color: var(--accent); }
.badge {
  background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px;
  min-width: 18px; height: 18px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center;
}
.menu {
  position: absolute; right: 0; top: 44px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 210px; z-index: 30; text-align: left;
}
.menu button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: 8px;
}
.menu button:hover { background: var(--surface-2); }
.menu .who { padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); margin-bottom: 4px; word-break: break-all; }

main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 80px; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; }
main.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); gap: 12px; } }

/* ---------- Tags sidebar ---------- */
aside { position: sticky; top: 120px; align-self: start; max-height: calc(100vh - 140px); overflow-y: auto; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px 10px; }
.tag-list { display: flex; flex-direction: column; gap: 2px; }
.tag-item {
  display: flex; justify-content: space-between; align-items: center; border: 0; background: transparent;
  padding: 7px 10px; border-radius: 8px; text-align: left; color: var(--text);
}
.tag-item:hover { background: var(--surface-2); }
.tag-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tag-item .n { color: var(--muted); font-size: 12px; }
@media (max-width: 820px) {
  aside { position: static; max-height: none; overflow: visible; }
  aside h3 { display: none; }
  .tag-list { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: none; }
  .tag-list::-webkit-scrollbar { display: none; }
  .tag-item { flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; gap: 6px; }
}

/* ---------- Composer ---------- */
.composer {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px; margin-bottom: 18px;
}
.composer:focus-within { border-color: var(--accent); }
.composer textarea {
  width: 100%; border: 0; outline: none; resize: none; background: transparent; min-height: 44px; max-height: 320px;
  padding: 4px 4px;
}
.composer-bar { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.composer-bar .spacer { flex: 1; }
.composer-bar .hint { font-size: 12px; color: var(--muted); }
.tool {
  border: 0; background: transparent; color: var(--muted); width: 34px; height: 34px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center;
}
.tool:hover { background: var(--surface-2); color: var(--text); }
.tool.on { background: var(--accent-soft); color: var(--accent); }
.remind-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 4px 2px; border-top: 1px dashed var(--border); margin-top: 8px; }
.remind-row .field { width: auto; padding: 6px 10px; font-size: 14px; }
.chip {
  border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 4px 10px; font-size: 13px;
}
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pending-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pending-files .chip { display: inline-flex; align-items: center; gap: 4px; }
.pending-files .chip button { border: 0; background: none; padding: 0 2px; color: var(--muted); }

/* ---------- Feed ---------- */
.status-line { display: flex; align-items: center; gap: 8px; margin: -6px 0 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.day { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; }
.day:first-child { margin-top: 0; }
.note {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px 8px;
  margin-bottom: 8px; position: relative;
}
.note.pinned { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.note.queued { opacity: .65; border-style: dashed; }
.note-body { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
.note-body a { word-break: break-all; }
.hashtag {
  border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 5px; font-weight: 600; font-size: .93em;
}
.note-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
.note-meta .spacer { flex: 1; }
.src { border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; font-size: 11px; text-transform: lowercase; }
.note-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
.note:hover .note-actions, .note:focus-within .note-actions { opacity: 1; }
@media (hover: none) { .note-actions { opacity: 1; } }
.note-actions .tool { width: 28px; height: 28px; }
.note-actions .tool.pin-on { color: var(--accent); }
.extra-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.attach { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.attach img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); cursor: zoom-in; }
.attach a.file { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); text-decoration: none; color: var(--text); font-size: 13px; }
.edit-box textarea { width: 100%; min-height: 80px; resize: vertical; }
.edit-box .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
.load-more { display: block; margin: 16px auto; }

/* ---------- Checklists ---------- */
.checklist { margin: 4px 0 2px; white-space: normal; }
.check-item { display: flex; gap: 9px; align-items: flex-start; padding: 3px 0; cursor: pointer; }
.check-item input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
.check-item span { white-space: pre-wrap; overflow-wrap: anywhere; }
.check-item.done span { text-decoration: line-through; color: var(--muted); }
.check-done { margin-top: 2px; }
.check-done summary { font-size: 12px; color: var(--muted); cursor: pointer; padding: 3px 0; list-style-position: inside; }
.add-item { width: 100%; border: 0; border-bottom: 1px dashed var(--border); background: transparent; outline: none; padding: 5px 0 4px 27px; font-size: 14px; color: var(--text); }
.add-item:focus { border-bottom-color: var(--accent); }
.progress { font-weight: 600; }

/* ---------- Headings, entries, nesting ---------- */
.note-body .h1 { font-size: 1.28em; font-weight: 700; line-height: 1.3; margin: 2px 0 4px; }
.note-body .h2 { font-size: 1.08em; font-weight: 700; margin: 8px 0 2px; }
.note-body .h3 { font-weight: 600; margin: 6px 0 2px; }
.note-body .stamp { font-size: 12px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--border); margin: 10px 0 2px; padding-top: 6px; }
.note-body .stamp:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.append-box { margin-top: 8px; display: grid; gap: 6px; }
.append-box textarea { width: 100%; min-height: 56px; resize: vertical; }
.append-box .row { display: flex; gap: 6px; justify-content: flex-end; }
.kids-btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 0 9px; font-size: 12px; font-weight: 600; color: var(--accent); }
.kids-btn:hover { border-color: var(--accent); }
.children { margin: 10px 0 2px; padding-left: 12px; border-left: 2px solid var(--accent-soft); display: grid; gap: 6px; }
.children .note { margin: 0; padding: 9px 12px 5px; font-size: 14px; background: var(--bg); }
.children .add-inside { font-size: 14px; padding: 7px 10px; }
.in-parent { border: 0; background: none; padding: 0; font-size: 12px; color: var(--accent); cursor: pointer; }
.picker-list { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; margin-top: 10px; }
.picker-list button { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-list button:hover { border-color: var(--accent); }

/* ---------- Board ---------- */
.board-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.board-head h2 { margin: 0; font-size: 18px; }
.board-picker { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.board-picker p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
.board-picker .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.column { background: var(--surface-2); border-radius: var(--radius); padding: 10px; scroll-snap-align: start; min-height: 200px; display: flex; flex-direction: column; }
.column h4 { margin: 2px 4px 10px; display: flex; justify-content: space-between; font-size: 14px; }
.column h4 span { color: var(--muted); font-weight: 500; }
.column .quick { margin-bottom: 8px; font-size: 14px; padding: 8px 10px; background: var(--surface); }
.column .note { padding: 10px 12px 6px; font-size: 14px; }
.column-list { overflow-y: auto; max-height: 70vh; }
@media (max-width: 820px) { .board { grid-auto-columns: 82%; } }

/* ---------- Reminders ---------- */
.rem-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 4px 8px; }
.rem { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.rem.overdue { border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
.rem.done .rem-text { text-decoration: line-through; color: var(--muted); }
.rem-check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); background: transparent; flex-shrink: 0; margin-top: 1px;
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.rem-check:hover { border-color: var(--ok); }
.rem.done .rem-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.rem-main { flex: 1; min-width: 0; }
.rem-text { overflow-wrap: anywhere; }
.rem-when { font-size: 13px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rem.overdue .rem-when .due { color: var(--danger); font-weight: 600; }
.rem.projected { background: transparent; border-style: dashed; }
.rem.projected .rem-text { color: var(--muted); }
.rem-edit { display: grid; gap: 6px; width: 100%; }
.rem-edit .row { display: flex; gap: 6px; flex-wrap: wrap; }
.rem-edit .field { padding: 7px 10px; font-size: 14px; }
.rem-edit .row .field { width: auto; flex: 1; min-width: 150px; }

/* ---------- Calendar ---------- */
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 820px) { .cal-wrap { grid-template-columns: minmax(0, 1fr); gap: 14px; } }
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
.cal-head h2 { margin: 0 6px; font-size: 18px; flex: 1; }
.cal-head .icon-btn { width: 34px; height: 34px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .05em; padding-bottom: 2px; }
.cal-day { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; min-height: 74px; padding: 5px 6px; text-align: left; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
.cal-day:hover { border-color: var(--accent); }
.cal-day.other { opacity: .45; }
.cal-day.today .num { background: var(--accent); color: var(--accent-text); }
.cal-day.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cal-day .num { font-size: 13px; font-weight: 600; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.cal-dots { display: flex; flex-wrap: wrap; gap: 3px; }
.cal-dot { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 0 6px; line-height: 16px; }
.cal-dot.r { background: var(--accent-soft); color: var(--accent); }
.cal-dot.r.over { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.cal-dot.r.done { background: var(--surface-2); color: var(--muted); }
.cal-dot.n { background: var(--surface-2); color: var(--muted); }
@media (max-width: 820px) {
  .cal-day { min-height: 50px; padding: 3px; align-items: center; }
  .cal-day .num { font-size: 12px; width: 22px; height: 22px; }
  .cal-dot { padding: 0 4px; font-size: 9px; line-height: 14px; }
}
.cal-agenda h3 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.cal-agenda h3 .spacer { flex: 1; }
.cal-agenda h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 2px 8px; }
.cal-agenda .note { font-size: 14px; }

.notice { background: var(--accent-soft); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; }

/* ---------- Settings ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(10, 8, 20, .45); z-index: 40; display: flex; align-items: flex-start; justify-content: center; padding: calc(env(safe-area-inset-top) + 40px) 16px 16px; overflow-y: auto; }
.modal { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 20px; }
.modal h2 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; }
.modal h2 .spacer { flex: 1; }
.modal h3 { margin: 22px 0 6px; font-size: 14px; }
.modal p.help { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.modal .row .field { flex: 1; min-width: 0; }
.agent { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.agent .info { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.agent .info strong { color: var(--text); font-size: 14px; }
.agent code { font-size: 12px; overflow-wrap: anywhere; }
.agent.revoked { opacity: .55; }
.pill-ok { color: var(--ok); font-weight: 600; }

/* ---------- Misc ---------- */
.toast-wrap { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); z-index: 50; display: grid; gap: 8px; width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 12px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; font-size: 14px; }
.toast span { flex: 1; }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 700; filter: brightness(1.3); }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.offline-pill { background: var(--warn); color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: inherit; border-radius: 3px; }
</style>
</head>
<body>

<!-- ============ Auth ============ -->
<section id="auth" class="hidden">
  <div class="auth-card">
    <img src="icon-192.png" alt="">
    <h1>BrainFeed</h1>
    <p>The private feed for your brain.</p>
    <form id="auth-form">
      <input class="field" type="email" id="auth-email" placeholder="Email" autocomplete="email" required>
      <input class="field" type="password" id="auth-pass" placeholder="Password" autocomplete="current-password" minlength="8" required>

</section>

<!-- ============ App ============ -->
<div id="app" class="hidden">
  <header>
    <div class="header-row">
      <div class="brand"><img src="favicon-32.png" alt=""><span>BrainFeed</span></div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="field" id="search" type="search" placeholder="Search notes or #tag" autocomplete="off">
      </label>
      <div style="position:relative">
        <button class="icon-btn" id="menu-btn" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </button>
        <div class="menu hidden" id="menu">
          <div class="who" id="who"></div>
          <button data-action="theme">Theme: <span id="theme-label">Auto</span></button>
          <button data-action="notify">Enable reminder alerts</button>
          <button data-action="settings">Settings &amp; connected agents</button>
          <button data-action="export">Export all notes (JSON)</button>

      </div>

    <nav class="tabs">
      <button class="tab active" data-view="feed">Feed</button>

  <main id="main">
    <aside id="aside">
      <h3>Tags</h3>

    <section id="view-feed">
      <div class="composer" id="composer">
        <textarea id="compose" rows="1" placeholder="What's on your mind? Use #tags to file it…"></textarea>
        <div class="pending-files" id="pending-files"></div>
        <div class="remind-row hidden" id="remind-row">
          <input class="field" type="datetime-local" id="remind-at">
          <select class="field" id="remind-repeat">
            <option value="">Once</option>
            <option value="daily">Every day</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekly">Every week</option>
            <option value="monthly">Every month</option>
            <option value="yearly">Every year</option>

          <button class="chip" data-quick="1h">In 1 hour</button>
          <button class="chip" data-quick="tonight">Tonight 8pm</button>
          <button class="chip" data-quick="tomorrow">Tomorrow 9am</button>
          <button class="chip" data-quick="monday">Monday 9am</button>
        </div>
        <div class="composer-bar">
          <button class="tool" id="attach-btn" title="Attach photo or file" aria-label="Attach">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          </button>
          <button class="tool" id="remind-btn" title="Make it a reminder" aria-label="Reminder">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          </button>
          <button class="tool" id="heading-btn" title="Heading (tap again for a smaller one)" aria-label="Heading">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16"/><path d="M18 4v16"/><path d="M6 12h12"/></svg>
          </button>

            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>

    <section id="view-calendar" class="hidden"></section>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="supabase.js"></script>
<script>
'use strict';
// ------------------------------------------------------------------
// Config. The publishable key is safe in public code: row-level
// security means it can only touch the signed-in user's own rows.
// ------------------------------------------------------------------
const SUPABASE_URL = 'https://bzvibdjrknqvmurwjroq.supabase.co';
const SUPABASE_KEY = 'sb_publishable__ybJKWB4JLb19YgGdW8LCg_Z4Xu5iSW';
const PAGE = 50;
const BUCKET = 'attachments';
const LS = { queue: 'bf-queue', cache: 'bf-cache', theme: 'bf-theme', alerted: 'bf-alerted' };

// A password-reset email link lands here with #...type=recovery; note it before
// the client reads (and clears) the hash.
let recovering = /type=recovery/.test(location.hash);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const state = {
  user: null, view: 'feed',
  notes: [], hasMore: false, loading: false,
  tag: null, pinned: false, archived: false, todo: false, archivedCount: 0, query: '',
  appending: null, expanded: new Set(), children: {}, childCounts: {}, parentTitles: {},
  remEditing: null, cal: { month: null, selected: null, notes: [] },
  tags: [], settings: null, reminders: [],
  files: [], remindMode: false, editing: null,
  boardNotes: {}, boardPicking: false, pickTags: [],
  agents: [],
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ------------------------------------------------------------------
// Toasts
// ------------------------------------------------------------------
function toast(msg, action, onAction, ms = 4000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action)}</button>` : '');
  $('#toasts').appendChild(el);
  let done = false;
  const close = () => { if (!done) { done = true; el.remove(); } };
  if (action) el.querySelector('button').onclick = () => { close(); onAction(); };
  setTimeout(close, ms);
  return close;
}

// ------------------------------------------------------------------
// Theme
// ------------------------------------------------------------------
function applyTheme() {
  const t = lsGet(LS.theme, 'auto');
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const l = $('#theme-label'); if (l) l.textContent = t[0].toUpperCase() + t.slice(1);
}
applyTheme();

// ------------------------------------------------------------------
// Auth
// ------------------------------------------------------------------
let signupMode = false;
$('#auth-toggle').onclick = () => {
  signupMode = !signupMode;
  $('#auth-submit').textContent = signupMode ? 'Create account' : 'Sign in';
  $('#auth-toggle').textContent = signupMode ? 'Have an account? Sign in' : 'First time? Create your account';
  $('#auth-pass').autocomplete = signupMode ? 'new-password' : 'current-password';
  $('#auth-msg').textContent = '';
};
$('#auth-form').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('#auth-email').value.trim(), password = $('#auth-pass').value;
  const msg = $('#auth-msg'); msg.className = 'auth-msg'; msg.textContent = '';
  $('#auth-submit').disabled = true;
  try {
    if (signupMode) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) {
        msg.className = 'auth-msg ok';
        msg.textContent = 'Account created. Check your email to confirm it, then sign in here.';
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    msg.textContent = /closed/i.test(err.message) || /Database error/i.test(err.message)
      ? 'Signups are closed for this BrainFeed.' : err.message;
  } finally { $('#auth-submit').disabled = false; }
};

$('#auth-forgot').onclick = async () => {
  const email = $('#auth-email').value.trim();
  const msg = $('#auth-msg'); msg.className = 'auth-msg';
  if (!email) { msg.textContent = 'Enter your email above first.'; $('#auth-email').focus(); return; }
  $('#auth-forgot').disabled = true;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  $('#auth-forgot').disabled = false;
  if (error) { msg.textContent = /rate/i.test(error.message) ? 'Too many emails sent. Wait a few minutes and try again.' : error.message; return; }
  msg.className = 'auth-msg ok';
  msg.textContent = 'If that email has an account, a reset link is on its way. Open it on this device.';
};

function showReset() {
  $('#app').classList.add('hidden');
  $('#auth').classList.remove('hidden');
  $('#auth-form').classList.add('hidden');
  $('#reset-form').classList.remove('hidden');
  $('#reset-pass').focus();
}

$('#reset-form').onsubmit = async (e) => {
  e.preventDefault();
  const a = $('#reset-pass').value, b = $('#reset-pass2').value;
  const msg = $('#reset-msg'); msg.className = 'auth-msg';
  if (a !== b) { msg.textContent = 'Passwords don\'t match.'; return; }
  $('#reset-submit').disabled = true;
  // Clear the flag first: updateUser fires USER_UPDATED before it resolves.
  recovering = false;
  const { error } = await sb.auth.updateUser({ password: a });
  $('#reset-submit').disabled = false;
  if (error) {
    recovering = true;
    msg.textContent = error.code === 'same_password'
      ? 'That is already your password. Reload the page to continue.' : error.message;
    return;
  }
  $('#reset-form').classList.add('hidden');
  $('#auth-form').classList.remove('hidden');
  toast('Password updated');
  const { data } = await sb.auth.getSession();
  if (data.session) { state.user = data.session.user; startApp(); }
};

sb.auth.onAuthStateChange((event, session) => {
  const u = session?.user || null;
  if (event === 'PASSWORD_RECOVERY') recovering = true;
  if (event === 'USER_UPDATED') return;
  if (u && recovering) { setTimeout(showReset, 0); return; }
  if (u && (!state.user || state.user.id !== u.id)) { state.user = u; setTimeout(startApp, 0); }
  else if (!u && event === 'SIGNED_OUT') { state.user = null; showAuth(); }
  else if (!u && event === 'INITIAL_SESSION') showAuth();
});

function showAuth() {
  $('#app').classList.add('hidden');
  $('#auth').classList.remove('hidden');
}

// ------------------------------------------------------------------
// App start
// ------------------------------------------------------------------
let realtime = null, reminderTimer = null;
async function startApp() {
  $('#auth').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#who').textContent = state.user.email;

  // Instant paint from cache, then fetch fresh
  const cached = lsGet(LS.cache, null);
  if (cached && cached.uid === state.user.id) { state.notes = cached.notes; renderFeed(); }

  await Promise.all([loadSettings(), loadTags(), loadNotes(true), loadReminders()]);
  await flushQueue();
  await handleIncoming();
  subscribe();
  if (!reminderTimer) reminderTimer = setInterval(checkDueReminders, 30000);
  checkDueReminders();
}

function subscribe() {
  if (realtime) sb.removeChannel(realtime);
  realtime = sb.channel('bf-' + state.user.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notes', filter: `user_id=eq.${state.user.id}` }, onNoteChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reminders', filter: `user_id=eq.${state.user.id}` }, () => loadReminders())
    .subscribe();
}

function onNoteChange({ eventType, new: row, old }) {
  if (eventType === 'DELETE') {
    state.notes = state.notes.filter((n) => n.id !== old.id);
  } else if (eventType === 'INSERT') {
    if (!state.notes.some((n) => n.id === row.id) && matchesFilter(row)) state.notes.unshift(row);
  } else if (eventType === 'UPDATE') {
    const i = state.notes.findIndex((n) => n.id === row.id);
    if (i >= 0) { if (matchesFilter(row)) state.notes[i] = row; else state.notes.splice(i, 1); }
  }
  if (state.editing == null) { renderFeed(); if (state.view === 'board') loadBoard(); }
  scheduleTagRefresh();
  scheduleNestingRefresh();
  if (state.view === 'calendar') { clearTimeout(calTimer); calTimer = setTimeout(loadCalendarNotes, 500); }
}

let tagTimer = null;
function scheduleTagRefresh() { clearTimeout(tagTimer); tagTimer = setTimeout(loadTags, 600); }

// ------------------------------------------------------------------
// Data: notes
// ------------------------------------------------------------------
function parseQuery(q) {
  const words = [], tags = [];
  for (const w of q.trim().split(/\s+/).filter(Boolean)) {
    if (/^#[A-Za-z][\w-]*$/.test(w)) tags.push(w.slice(1).toLowerCase());
    else words.push(w);
  }
  return { words, tags };
}

const OPEN_ITEM_RE = /^\s*[-*] \[ \]/m;

const isMainFeed = () => !state.tag && !state.pinned && !state.archived && !state.todo && !state.query;

function matchesFilter(n) {
  // Notes inside another note live under their parent, not in the main feed.
  if (n.parent_id && isMainFeed()) return false;
  if (state.todo && !OPEN_ITEM_RE.test(n.body)) return false;
  // Archived notes only show in the Archived view, or when searching.
  if (state.archived ? !n.archived_at : (n.archived_at && !state.query)) return false;
  if (state.tag && !n.tags.includes(state.tag)) return false;
  if (state.pinned && !n.pinned) return false;
  const { words, tags } = parseQuery(state.query);
  if (tags.some((t) => !n.tags.includes(t))) return false;
  const b = n.body.toLowerCase();
  return words.every((w) => b.includes(w.toLowerCase()));
}

async function loadNotes(reset) {
  if (state.loading) return;
  state.loading = true;
  if (reset) renderStatus(true);
  const offset = reset ? 0 : state.notes.length;
  let q = sb.from('notes').select(NOTE_SELECT)
    .order('created_at', { ascending: false }).range(offset, offset + PAGE - 1);
  if (isMainFeed()) q = q.is('parent_id', null);
  if (state.archived) q = q.not('archived_at', 'is', null);
  else if (!state.query) q = q.is('archived_at', null);
  if (state.todo) q = q.like('body', '%[ ]%');
  if (state.tag) q = q.contains('tags', [state.tag]);
  if (state.pinned) q = q.eq('pinned', true);
  const { words, tags } = parseQuery(state.query);
  if (tags.length) q = q.contains('tags', tags);
  for (const w of words) q = q.ilike('body', `%${w.replace(/[%_\\]/g, '\\$&')}%`);
  const { data, error } = await q;
  state.loading = false;
  if (error) {
    renderStatus(false, navigator.onLine ? 'Couldn\'t load notes: ' + error.message : null);
    return;
  }
  state.notes = reset ? data : state.notes.concat(data);
  state.hasMore = data.length === PAGE;
  await loadNestingInfo(data);
  if (!state.tag && !state.pinned && !state.archived && !state.todo && !state.query) lsSet(LS.cache, { uid: state.user.id, notes: state.notes.slice(0, PAGE) });
  renderFeed();
}

const NOTE_SELECT = 'id,body,tags,source,pinned,attachments,archived_at,parent_id,created_at,updated_at';
const firstLine = (body) => (body.split('\n').find((l) => l.trim()) || '').replace(/^#{1,3} |^[-*] \[[ xX]\] /, '').slice(0, 60);

// Child counts for notes on screen, and titles of parents for notes shown outside them.
async function loadNestingInfo(notes) {
  const ids = notes.filter((n) => !n.parent_id).map((n) => n.id);
  const parentIds = [...new Set(notes.map((n) => n.parent_id).filter((p) => p && !state.parentTitles[p]))];
  const [counts, parents] = await Promise.all([
    ids.length ? sb.rpc('child_counts', { p_ids: ids }) : { data: [] },
    parentIds.length ? sb.from('notes').select('id,body').in('id', parentIds) : { data: [] },
  ]);
  for (const id of ids) delete state.childCounts[id];
  for (const r of counts.data || []) state.childCounts[r.parent_id] = Number(r.count);
  for (const p of parents.data || []) state.parentTitles[p.id] = firstLine(p.body);
}

async function loadChildren(parentId) {
  const { data } = await sb.from('notes').select(NOTE_SELECT).eq('parent_id', parentId).order('created_at');
  state.children[parentId] = data || [];
  state.childCounts[parentId] = state.children[parentId].length;
}

let nestTimer = null;
function scheduleNestingRefresh() {
  clearTimeout(nestTimer);
  nestTimer = setTimeout(async () => {
    await Promise.all([loadNestingInfo(state.notes), ...[...state.expanded].map(loadChildren)]);
    if (state.editing == null) rerender();
  }, 500);
}

async function loadTags() {
  const [{ data, error }, { data: archived }] = await Promise.all([sb.rpc('tag_counts'), sb.rpc('archived_count')]);
  if (!error) { state.tags = data; state.archivedCount = Number(archived) || 0; renderTags(); }
}

async function loadSettings() {
  let { data } = await sb.from('settings').select('*').maybeSingle();
  if (!data) {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Los_Angeles';
    ({ data } = await sb.from('settings').insert({ timezone: tz }).select().single());
  }
  state.settings = data || { board_tags: [] };
}

function newId() {
  return crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}

async function addNote(body, files = [], source = 'web') {
  const id = newId();
  const created_at = new Date().toISOString();
  const optimistic = { id, body, tags: localTags(body), source, pinned: false, attachments: [], created_at, _queued: !navigator.onLine };
  if (matchesFilter(optimistic)) { state.notes.unshift(optimistic); renderFeed(); }

  if (!navigator.onLine) {
    if (files.length) toast('Offline: the text was saved, but files need a connection.');
    queuePush({ id, body, source, created_at });
    return;
  }
  try {
    const attachments = [];
    for (const f of files) attachments.push(await uploadFile(id, f));
    const { data, error } = await sb.from('notes').insert({ id, body, source, attachments, created_at }).select().single();
    if (error) throw error;
    replaceNote(data);
    scheduleTagRefresh();
  } catch (err) {
    if (!navigator.onLine || /fetch|network/i.test(err.message)) {
      queuePush({ id, body, source, created_at });
      markQueued(id);
    } else {
      state.notes = state.notes.filter((n) => n.id !== id); renderFeed();
      toast('Couldn\'t save: ' + err.message);
    }
  }
}

function localTags(body) {
  const out = new Set();
  body.replace(/(^|[^&\w])#([A-Za-z][\w-]*)/g, (_, a, t) => out.add(t.toLowerCase()));
  return [...out].sort();
}

function replaceNote(row) {
  const i = state.notes.findIndex((n) => n.id === row.id);
  if (i >= 0) state.notes[i] = row;
  for (const k in state.boardNotes) state.boardNotes[k] = state.boardNotes[k].map((n) => (n.id === row.id ? row : n));
  for (const k in state.children) state.children[k] = state.children[k].map((n) => (n.id === row.id ? row : n));
  state.cal.notes = state.cal.notes.map((n) => (n.id === row.id ? row : n));
  rerender();
}
function findNote(id) { return state.notes.find((n) => n.id === id) || Object.values(state.children).flat().find((n) => n.id === id) || Object.values(state.boardNotes).flat().find((n) => n.id === id) || state.cal.notes.find((n) => n.id === id); }
function rerender() { renderFeed(); if (state.view === 'board') renderBoard(); if (state.view === 'calendar') renderCalendar(); focusEdit(); }
function focusEdit() { const et = $('#edit-text'); if (et && document.activeElement !== et) { et.focus(); et.setSelectionRange(et.value.length, et.value.length); } }
function markQueued(id) { const n = state.notes.find((x) => x.id === id); if (n) { n._queued = true; renderFeed(); } }

// Offline queue ------------------------------------------------------
function queuePush(item) { const q = lsGet(LS.queue, []); q.push(item); lsSet(LS.queue, q); renderStatus(); }
async function flushQueue() {
  const q = lsGet(LS.queue, []);
  if (!q.length || !navigator.onLine) return;
  const left = [];
  for (const item of q) {
    const { data, error } = await sb.from('notes').upsert(item, { onConflict: 'id', ignoreDuplicates: true }).select().maybeSingle();
    if (error) left.push(item);
    else if (data) replaceNote(data);
  }
  lsSet(LS.queue, left);
  if (q.length > left.length) { toast(`Synced ${q.length - left.length} offline note${q.length - left.length > 1 ? 's' : ''}`); scheduleTagRefresh(); loadNotes(true); }
  renderStatus();
}
window.addEventListener('online', () => { flushQueue(); renderStatus(); });
window.addEventListener('offline', () => renderStatus());

// Attachments --------------------------------------------------------
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type) || file.size < 600 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const max = 2000, scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.85));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return file; }
}

async function uploadFile(noteId, file) {
  file = await shrinkImage(file);
  const safe = file.name.replace(/[^\w.-]+/g, '_').slice(-80) || 'file';
  const path = `${state.user.id}/${noteId}/${Date.now()}-${safe}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'application/octet-stream' });
  if (error) throw error;
  return { path, name: file.name, type: file.type, size: file.size };
}

const urlCache = new Map();
async function signUrls(paths) {
  const need = paths.filter((p) => { const c = urlCache.get(p); return !c || c.exp < Date.now(); });
  if (!need.length) return;
  const { data } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
  for (const d of data || []) if (d.signedUrl) urlCache.set(d.path, { url: d.signedUrl, exp: Date.now() + 3500e3 });
}

async function hydrateAttachments(root) {
  const els = [...root.querySelectorAll('[data-path]')];
  if (!els.length) return;
  await signUrls([...new Set(els.map((e) => e.dataset.path))]);
  for (const el of els) {
    const c = urlCache.get(el.dataset.path); if (!c) continue;
    if (el.tagName === 'IMG') el.src = c.url; else el.href = c.url;
  }
}

// ------------------------------------------------------------------
// Rendering: feed
// ------------------------------------------------------------------
function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((today - x) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return x.toLocaleDateString(undefined, { weekday: 'long' });
  return x.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: x.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
}
const timeLabel = (d) => new Date(d).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

function highlight(html) {
  const { words } = parseQuery(state.query);
  if (!words.length) return html;
  const re = new RegExp('(' + words.map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  // only touch text outside tags
  return html.replace(/(^|>)([^<]+)/g, (_, a, text) => a + text.replace(re, '<mark>$1</mark>'));
}

function formatBody(body) {
  const parts = body.split(/(https?:\/\/[^\s<>"]+)/g);
  return parts.map((p, i) => {
    if (i % 2 === 1) {
      const m = p.match(/^(.*?)([.,;:!?)\]]*)$/);
      const url = m[1], trail = m[2];
      return `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\/(www\.)?/, ''))}</a>${esc(trail)}`;
    }
    return esc(p).replace(/(^|[^&\w;])#([A-Za-z][\w-]*)/g, (_, a, t) => `${a}<button class="hashtag" data-tag="${esc(t.toLowerCase())}">#${esc(t)}</button>`);
  }).join('');
}

// ------------------------------------------------------------------
// Checklists: lines like "- [ ] milk" / "- [x] eggs" anywhere in a note.
// Stored as plain text, so every source (Hermes, iPhone, search) works.
// ------------------------------------------------------------------
const CHECK_RE = /^\s*[-*] \[([ xX])\] ?(.*)$/;
// "# Title", "## Section", "### Small" (a space after the #s, so #tags never match)
const HEAD_RE = /^(#{1,3}) (\S.*)$/;
// Entry stamps written by "Add to this note": "— Oct 4, 8:30 PM"
const STAMP_RE = /^(— [A-Z][a-z]{2} \d{1,2}, \d{1,2}:\d{2}\s?[AP]M)$/;

function checklistItems(body) {
  return body.split('\n').map((l, i) => { const m = l.match(CHECK_RE); return m && { i, done: m[1] !== ' ', text: m[2] }; }).filter(Boolean);
}

function progressLabel(body) {
  const items = checklistItems(body);
  if (!items.length) return '';
  return `<span class="progress">${items.filter((x) => x.done).length}/${items.length} done</span>`;
}

function renderBody(body) {
  const out = [];
  let text = [], block = null;
  const flushText = () => {
    const t = text.join('\n').replace(/^\n+|\n+$/g, '');
    if (t) out.push(`<div>${formatBody(t)}</div>`);
    text = [];
  };
  const flushBlock = () => { if (block) out.push(checklistHtml(block)); block = null; };
  body.split('\n').forEach((line, i) => {
    const m = line.match(CHECK_RE);
    if (m) { flushText(); (block ||= []).push({ i, done: m[1] !== ' ', text: m[2] }); return; }
    flushBlock();
    const h = line.match(HEAD_RE);
    if (h) { flushText(); out.push(`<div class="h${h[1].length}">${formatBody(h[2])}</div>`); return; }
    const st = line.match(STAMP_RE);
    if (st) { flushText(); out.push(`<div class="stamp">${esc(st[1])}</div>`); return; }
    text.push(line);
  });
  flushText(); flushBlock();
  return out.join('');
}

function checklistHtml(items) {
  const row = (x) => `<label class="check-item${x.done ? ' done' : ''}"><input type="checkbox" data-check="${x.i}"${x.done ? ' checked' : ''}><span>${formatBody(x.text) || '&nbsp;'}</span></label>`;
  const open = items.filter((x) => !x.done), done = items.filter((x) => x.done);
  return `<div class="checklist">${open.map(row).join('')}`
    + (done.length ? `<details class="check-done"${open.length ? '' : ' open'}><summary>${done.length} completed</summary>${done.map(row).join('')}</details>` : '')
    + `<input class="add-item" data-add-after="${items[items.length - 1].i}" placeholder="+ Add item" enterkeyhint="done"></div>`;
}

// Redraws replace the DOM; keep the cursor in an "+ Add item" box (and what's typed in it).
function withAddFocus(draw) {
  const a = document.activeElement;
  const SEL = '[data-add-after], [data-append], [data-add-inside]';
  const info = a && a.matches && a.matches(SEL) ? (() => {
    const card = a.closest('[data-id]');
    return { id: card?.dataset.id, view: a.closest('#view-board') ? 'board' : 'feed', idx: [...card.querySelectorAll(SEL)].indexOf(a), value: a.value, caret: a.selectionStart };
  })() : null;
  draw();
  const root = (info?.view === 'board') ? $('#view-board') : $('#feed');
  if (!info) {
    if (state.appendFocus) {
      const ap = root?.querySelector('[data-append]');
      if (ap) { state.appendFocus = false; ap.focus(); }
    }
    return;
  }
  const el = root?.querySelectorAll(`[data-id="${info.id}"] ${SEL.split(', ').join(`, [data-id="${info.id}"] `)}`)[info.idx];
  if (el) { el.value = info.value; el.focus(); try { el.setSelectionRange(info.caret, info.caret); } catch {} }
}

async function setNoteBody(note, body) {
  const old = note.body;
  note.body = body; note.tags = localTags(body); rerender();
  const { data, error } = await sb.from('notes').update({ body }).eq('id', note.id).select().single();
  if (error) { note.body = old; rerender(); toast('Couldn\'t save: ' + error.message); return false; }
  replaceNote(data); scheduleTagRefresh();
  return true;
}

document.addEventListener('change', async (e) => {
  const cb = e.target.closest('[data-check]');
  if (!cb) return;
  const note = findNote(cb.closest('[data-id]')?.dataset.id);
  if (!note) return;
  const lines = note.body.split('\n');
  const i = +cb.dataset.check;
  if (!CHECK_RE.test(lines[i] || '')) return;
  lines[i] = lines[i].replace(/\[[ xX]\]/, cb.checked ? '[x]' : '[ ]');
  if (!(await setNoteBody(note, lines.join('\n')))) return;
  const items = checklistItems(note.body);
  if (cb.checked && items.length && items.every((x) => x.done) && !note.archived_at) {
    toast('All done ✓', 'Archive list', () => archiveNote(note, true), 6000);
  }
});

document.addEventListener('keydown', async (e) => {
  const ap = e.target.closest?.('[data-append]');
  if (ap) {
    if (e.key === 'Escape') { state.appending = null; rerender(); return; }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && (e.metaKey || e.ctrlKey || !matchMedia('(hover: none)').matches)) {
      e.preventDefault();
      const note = findNote(ap.closest('[data-id]').dataset.id);
      if (note) appendToNote(note, ap.value);
    }
    return;
  }
  const inside = e.target.closest?.('[data-add-inside]');
  if (inside && e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    const body = inside.value.trim();
    if (!body) return;
    const parentId = inside.closest('[data-id]').dataset.id;
    inside.value = '';
    const { error } = await sb.from('notes').insert({ body, parent_id: parentId });
    if (error) { toast('Couldn\'t add: ' + error.message); inside.value = body; return; }
    await loadChildren(parentId); scheduleTagRefresh(); rerender();
    return;
  }
  const input = e.target.closest?.('[data-add-after]');
  if (!input || e.key !== 'Enter' || e.isComposing) return;
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  const id = input.closest('[data-id]').dataset.id;
  const note = findNote(id);
  if (!note) return;
  const lines = note.body.split('\n');
  lines.splice(+input.dataset.addAfter + 1, 0, '- [ ] ' + text);
  input.value = '';
  await setNoteBody(note, lines.join('\n'));
});

// Enter on a checklist line continues the list; Enter on an empty item ends it.
function continueChecklist(ta, e) {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.metaKey || e.ctrlKey) return false;
  const v = ta.value, pos = ta.selectionStart;
  if (pos !== ta.selectionEnd) return false;
  const start = v.lastIndexOf('\n', pos - 1) + 1;
  const m = v.slice(start, pos).match(/^(\s*[-*] \[[ xX]\] ?)(.*)$/);
  if (!m) return false;
  e.preventDefault();
  if (!m[2].trim()) {
    ta.value = v.slice(0, start) + v.slice(pos);
    ta.setSelectionRange(start, start);
  } else {
    const ins = '\n- [ ] ';
    ta.value = v.slice(0, pos) + ins + v.slice(pos);
    ta.setSelectionRange(pos + ins.length, pos + ins.length);
  }
  ta.dispatchEvent(new Event('input'));
  return true;
}

function noteHtml(n, compact = false, child = false) {
  if (state.editing === n.id) {
    return `<div class="note edit-box" data-id="${n.id}">
      <textarea class="field" id="edit-text">${esc(n.body)}</textarea>
      <div class="row"><button class="btn ghost small" data-act="cancel">Cancel</button><button class="btn small" data-act="save">Save</button></div>
    </div>`;
  }
  const inBody = new Set(localTags(n.body));
  const extra = (n.tags || []).filter((t) => !inBody.has(t));
  const att = (n.attachments || []).map((a) => /^image\//.test(a.type)
    ? `<img data-path="${esc(a.path)}" alt="${esc(a.name)}" loading="lazy" data-act="zoom">`
    : `<a class="file" data-path="${esc(a.path)}" target="_blank" rel="noopener">${ICON.file}${esc(a.name)}</a>`).join('');
  return `<article class="note${n.pinned ? ' pinned' : ''}${n._queued ? ' queued' : ''}" data-id="${n.id}">
    <div class="note-body">${highlight(renderBody(n.body))}</div>
    ${state.appending === n.id ? `<div class="append-box">
      <textarea class="field" data-append placeholder="Add to this note…"></textarea>
      <div class="row"><button class="btn ghost small" data-act="append-cancel">Cancel</button><button class="btn small" data-act="append-save">Add</button></div>
    </div>` : ''}
    ${extra.length ? `<div class="extra-tags">${extra.map((t) => `<button class="hashtag" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>` : ''}
    ${att ? `<div class="attach">${att}</div>` : ''}
    <div class="note-meta">
      <span>${compact ? dayLabel(n.created_at) + ' · ' : ''}${timeLabel(n.created_at)}</span>
      ${n.source && n.source !== 'web' ? `<span class="src">${esc(n.source)}</span>` : ''}
      ${n._queued ? '<span class="src">waiting to sync</span>' : ''}
      ${n.pinned ? `<span style="color:var(--accent)">${ICON.pin}</span>` : ''}
      ${n.archived_at ? '<span class="src">archived</span>' : ''}
      ${progressLabel(n.body)}
      ${n.parent_id && !child ? `<button class="in-parent" data-act="open-parent" data-parent="${n.parent_id}">in: ${esc(state.parentTitles[n.parent_id] || 'another note')}</button>` : ''}
      ${!child && !compact && state.childCounts[n.id] ? `<button class="kids-btn" data-act="toggle-kids">${state.expanded.has(n.id) ? '▾' : '▸'} ${state.childCounts[n.id]} inside</button>` : ''}
      <span class="spacer"></span>
      <span class="note-actions">
        <button class="tool${n.pinned ? ' pin-on' : ''}" data-act="pin" title="${n.pinned ? 'Unpin' : 'Pin'}">${ICON.pin}</button>
        <button class="tool" data-act="copy" title="Copy">${ICON.copy}</button>
        ${compact ? '' : `<button class="tool" data-act="remind" title="Remind me about this">${ICON.bell}</button>`}
        <button class="tool" data-act="edit" title="Edit">${ICON.edit}</button>
        <button class="tool" data-act="append" title="Add to this note">${ICON.plus}</button>
        ${n.parent_id ? `<button class="tool" data-act="take-out" title="Take out of the note it's in">${ICON.folderOut}</button>`
          : (compact || state.childCounts[n.id]) ? '' : `<button class="tool" data-act="move" title="Move into another note">${ICON.folder}</button>`}
        <button class="tool" data-act="archive" title="${n.archived_at ? 'Unarchive' : 'Archive'}">${ICON.archive}</button>
        <button class="tool" data-act="delete" title="Delete">${ICON.trash}</button>
      </span>
    </div>
    ${!child && !compact && state.expanded.has(n.id) ? `<div class="children">
      ${(state.children[n.id] || []).map((c) => noteHtml(c, true, true)).join('')}
      <input class="field add-inside" data-add-inside placeholder="+ New note inside… (Enter to add)" enterkeyhint="done">
    </div>` : ''}
  </article>`;
}

function renderFeed() {
  const feed = $('#feed');
  if (!state.notes.length) {
    const filtered = state.tag || state.pinned || state.todo || state.query;
    feed.innerHTML = state.loading ? '' : state.archived && !filtered
      ? '<div class="empty"><strong>No archived notes</strong>Use the box icon on a note to archive it. It leaves your feed but stays searchable.</div>'
      : `<div class="empty"><strong>${filtered ? 'Nothing matches' : 'Your feed is empty'}</strong>${filtered ? 'Try a different search or tag.' : 'Type a thought above and hit Enter. Add #tags to file it.'}</div>`;
  } else {
    let html = '', lastDay = '';
    for (const n of state.notes) {
      const d = dayLabel(n.created_at);
      if (d !== lastDay) { html += `<div class="day">${esc(d)}</div>`; lastDay = d; }
      html += noteHtml(n);
    }
    withAddFocus(() => { feed.innerHTML = html; });
    hydrateAttachments(feed);
  }
  $('#load-more').classList.toggle('hidden', !state.hasMore);
  renderStatus();
}

function renderStatus(loading) {
  const el = $('#status-line'); if (!el) return;
  const bits = [];
  if (loading) bits.push('<span class="spinner"></span>');
  if (!navigator.onLine) bits.push('<span class="offline-pill">Offline</span>');
  const q = lsGet(LS.queue, []).length;
  if (q) bits.push(`${q} note${q > 1 ? 's' : ''} waiting to sync`);
  if (state.tag) bits.push(`Showing <button class="hashtag" data-tag="${esc(state.tag)}">#${esc(state.tag)}</button> <button class="btn ghost small" data-act="clear">Clear</button>`);
  else if (state.pinned) bits.push('Showing pinned notes <button class="btn ghost small" data-act="clear">Clear</button>');
  else if (state.todo) bits.push('Showing notes with open checklist items <button class="btn ghost small" data-act="clear">Clear</button>');
  else if (state.archived) bits.push('Showing archived notes <button class="btn ghost small" data-act="clear">Clear</button>');
  if (state.query && !loading) bits.push(`${state.notes.length}${state.hasMore ? '+' : ''} result${state.notes.length === 1 ? '' : 's'}`);
  el.innerHTML = bits.join(' ');
  el.classList.toggle('hidden', !bits.length);
}

function renderTags() {
  const total = state.tags.reduce((a, t) => a + Number(t.count), 0);
  let html = `<button class="tag-item${!state.tag && !state.pinned && !state.archived && !state.todo ? ' active' : ''}" data-filter="all"><span>All notes</span></button>`;
  html += `<button class="tag-item${state.pinned ? ' active' : ''}" data-filter="pinned"><span>Pinned</span></button>`;
  html += `<button class="tag-item${state.todo ? ' active' : ''}" data-filter="todo"><span>To-do</span></button>`;
  html += `<button class="tag-item${state.archived ? ' active' : ''}" data-filter="archived"><span>Archived</span>${state.archivedCount ? `<span class="n">${state.archivedCount}</span>` : ''}</button>`;
  for (const t of state.tags) {
    html += `<button class="tag-item${state.tag === t.tag ? ' active' : ''}" data-tag="${esc(t.tag)}"><span>#${esc(t.tag)}</span><span class="n">${t.count}</span></button>`;
  }
  $('#tag-list').innerHTML = html;
  if (state.view === 'board' && state.boardPicking) renderBoard();
}

// ------------------------------------------------------------------
// Composer
// ------------------------------------------------------------------
const compose = $('#compose');
function autosize() { compose.style.height = 'auto'; compose.style.height = Math.min(compose.scrollHeight, 320) + 'px'; }
compose.addEventListener('input', autosize);
compose.addEventListener('keydown', (e) => {
  if (continueChecklist(compose, e)) return;
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitCompose(); return; }
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(hover: none)').matches) { e.preventDefault(); submitCompose(); }
});
// Heading button: "# " on the current line; again for "## ", again to remove.
$('#heading-btn').onclick = () => {
  const v = compose.value, pos = compose.selectionStart ?? v.length;
  const start = v.lastIndexOf('\n', pos - 1) + 1;
  const end = v.indexOf('\n', start) === -1 ? v.length : v.indexOf('\n', start);
  const line = v.slice(start, end);
  const next = /^# /.test(line) ? line.replace(/^# /, '## ') : /^## /.test(line) ? line.replace(/^## /, '') : '# ' + line;
  compose.value = v.slice(0, start) + next + v.slice(end);
  const caret = start + next.length;
  compose.focus(); compose.setSelectionRange(caret, caret); autosize();
};
$('#list-btn').onclick = () => {
  const v = compose.value;
  const prefix = !v ? '- [ ] ' : (v.endsWith('\n') ? '' : '\n') + '- [ ] ';
  compose.value = v + prefix;
  compose.focus();
  compose.setSelectionRange(compose.value.length, compose.value.length);
  autosize();
};
if (matchMedia('(hover: none)').matches) $('#compose-hint').classList.add('hidden');
$('#send-btn').onclick = submitCompose;
$('#attach-btn').onclick = () => $('#file-input').click();
$('#file-input').onchange = (e) => { state.files.push(...e.target.files); e.target.value = ''; renderPendingFiles(); };
compose.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); state.files.push(...files); renderPendingFiles(); }
});
$('#composer').addEventListener('dragover', (e) => e.preventDefault());
$('#composer').addEventListener('drop', (e) => {
  e.preventDefault();
  const files = [...(e.dataTransfer?.files || [])];
  if (files.length) { state.files.push(...files); renderPendingFiles(); }
});
function renderPendingFiles() {
  $('#pending-files').innerHTML = state.files.map((f, i) => `<span class="chip">${ICON.file} ${esc(f.name)} <button data-rm="${i}" aria-label="Remove">×</button></span>`).join('');
}
$('#pending-files').onclick = (e) => { const i = e.target.dataset.rm; if (i != null) { state.files.splice(+i, 1); renderPendingFiles(); } };

$('#remind-btn').onclick = () => setRemindMode(!state.remindMode);
function setRemindMode(on) {
  state.remindMode = on;
  $('#remind-btn').classList.toggle('on', on);
  $('#remind-row').classList.toggle('hidden', !on);
  $('#send-btn').textContent = on ? 'Set reminder' : 'Save';
  compose.placeholder = on ? 'Remind me to…' : 'What\'s on your mind? Use #tags to file it…';
  if (on && !$('#remind-at').value) setQuick('1h');
  compose.focus();
}
function toLocalInput(d) {
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function setQuick(k) {
  const d = new Date();
  if (k === '1h') { d.setHours(d.getHours() + 1); d.setSeconds(0); }
  else if (k === 'tonight') { d.setHours(20, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); }
  else if (k === 'tomorrow') { d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); }
  else if (k === 'monday') { d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); d.setHours(9, 0, 0, 0); }
  $('#remind-at').value = toLocalInput(d);
}
$('#remind-row').addEventListener('click', (e) => { const k = e.target.dataset.quick; if (k) { e.preventDefault(); setQuick(k); } });

async function submitCompose() {
  const body = compose.value.trim();
  if (!body && !state.files.length) return;
  if (state.remindMode) {
    const at = $('#remind-at').value;
    if (!at) { toast('Pick a time for the reminder.'); return; }
    const due = new Date(at);
    const { error } = await sb.from('reminders').insert({ body: body || 'Reminder', due_at: due.toISOString(), repeat: $('#remind-repeat').value || null });
    if (error) { toast('Couldn\'t save reminder: ' + error.message); return; }
    toast('Reminder set for ' + whenLabel(due));
    compose.value = ''; $('#remind-repeat').value = ''; $('#remind-at').value = ''; setRemindMode(false); autosize();
    loadReminders();
    return;
  }
  const files = state.files; state.files = []; renderPendingFiles();
  compose.value = ''; autosize();
  await addNote(body, files);
}

document.addEventListener('click', async (e) => {
  const tagBtn = e.target.closest('[data-tag]');
  if (tagBtn && !e.target.closest('.board-picker')) { setFilter({ tag: tagBtn.dataset.tag }); return; }
  const f = e.target.closest('[data-filter]');
  if (f) { setFilter(f.dataset.filter === 'pinned' ? { pinned: true } : f.dataset.filter === 'archived' ? { archived: true } : f.dataset.filter === 'todo' ? { todo: true } : {}); return; }
  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;
  if (act === 'clear') { setFilter({}); return; }
  const card = actEl.closest('[data-id]');
  const id = card?.dataset.id;
  const note = findNote(id);
  if (act === 'zoom') { openLightbox(actEl.src); return; }
  if (act === 'open-parent') { openParent(actEl.dataset.parent); return; }
  if (!note) return;
  if (act === 'pin') {
    const pinned = !note.pinned;
    note.pinned = pinned; rerender();
    const { error } = await sb.from('notes').update({ pinned }).eq('id', id);
    if (error) { note.pinned = !pinned; rerender(); toast('Couldn\'t update: ' + error.message); }
  } else if (act === 'copy') {
    try { await navigator.clipboard.writeText(note.body); toast('Copied'); } catch { toast('Copy failed'); }
  } else if (act === 'remind') {
    compose.value = note.body.replace(/(^|\s)#[A-Za-z][\w-]*/g, '').trim(); autosize();
    setRemindMode(true); window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (act === 'edit') {
    state.editing = id; rerender();
  } else if (act === 'cancel') {
    state.editing = null; rerender();
  } else if (act === 'save') {
    await saveEdit(note);
  } else if (act === 'append') {
    state.appending = state.appending === id ? null : id; state.appendFocus = !!state.appending; rerender();
  } else if (act === 'append-cancel') {
    state.appending = null; rerender();
  } else if (act === 'append-save') {
    appendToNote(note, card.querySelector('[data-append]').value);
  } else if (act === 'toggle-kids') {
    if (state.expanded.has(id)) state.expanded.delete(id);
    else { await loadChildren(id); state.expanded.add(id); }
    rerender();
  } else if (act === 'move') {
    openMovePicker(note);
  } else if (act === 'take-out') {
    moveNote(note, null);
  } else if (act === 'archive') {
    archiveNote(note, !note.archived_at);
  } else if (act === 'delete') {
    deleteNote(note);
  }
});

async function archiveNote(note, archive, quiet = false) {
  const prev = note.archived_at;
  const archived_at = archive ? new Date().toISOString() : null;
  note.archived_at = archived_at;
  const idx = state.notes.findIndex((n) => n.id === note.id);
  if (idx >= 0 && !matchesFilter(note)) state.notes.splice(idx, 1);
  if (archive) for (const k in state.boardNotes) state.boardNotes[k] = state.boardNotes[k].filter((n) => n.id !== note.id);
  rerender();
  const { error } = await sb.from('notes').update({ archived_at }).eq('id', note.id);
  if (error) {
    note.archived_at = prev;
    toast('Couldn\'t ' + (archive ? 'archive' : 'unarchive') + ': ' + error.message);
    loadNotes(true); if (state.view === 'board') loadBoard();
    return;
  }
  scheduleTagRefresh();
  if (state.view === 'board' && !archive) loadBoard();
  if (!quiet) toast(archive ? 'Note archived' : 'Note moved back to your feed', 'Undo', async () => {
    await archiveNote(note, !archive, true);
    if (matchesFilter(note) && !state.notes.some((n) => n.id === note.id)) loadNotes(true);
  });
}

document.addEventListener('keydown', (e) => {
  if (e.target.id === 'edit-text') {
    if (continueChecklist(e.target, e)) return;
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const n = findNote(state.editing); if (n) saveEdit(n); }
    if (e.key === 'Escape') { state.editing = null; rerender(); }
  }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#search').focus(); }
});

async function saveEdit(note) {
  const body = $('#edit-text').value.trim();
  state.editing = null;
  if (!body || body === note.body) { rerender(); return; }
  const old = note.body; note.body = body; note.tags = localTags(body); rerender();
  const { data, error } = await sb.from('notes').update({ body }).eq('id', note.id).select().single();
  if (error) { note.body = old; rerender(); toast('Couldn\'t save: ' + error.message); return; }
  replaceNote(data); scheduleTagRefresh();
  if (state.view === 'board') loadBoard();
}

async function appendToNote(note, raw) {
  const text = (raw || '').trim();
  if (!text) return;
  const stamp = '— ' + new Date().toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).replace(/\s/g, ' ');
  state.appending = null;
  await setNoteBody(note, note.body.replace(/\s+$/, '') + '\n\n' + stamp + '\n' + text);
}

async function moveNote(note, parentId) {
  const prev = note.parent_id;
  const { error } = await sb.from('notes').update({ parent_id: parentId }).eq('id', note.id);
  if (error) { toast(/cannot/i.test(error.message) ? error.message : 'Couldn\'t move: ' + error.message); return; }
  note.parent_id = parentId;
  if (prev && state.children[prev]) state.children[prev] = state.children[prev].filter((n) => n.id !== note.id);
  const i = state.notes.findIndex((n) => n.id === note.id);
  if (i >= 0 && !matchesFilter(note)) state.notes.splice(i, 1);
  if (!parentId && !state.notes.some((n) => n.id === note.id) && matchesFilter(note)) { state.notes.push(note); state.notes.sort((a, b) => b.created_at.localeCompare(a.created_at)); }
  if (parentId) { state.expanded.add(parentId); await loadChildren(parentId); }
  if (prev) await loadChildren(prev);
  await loadNestingInfo(state.notes);
  rerender();
  toast(parentId ? `Moved into "${state.parentTitles[parentId] || firstLine((findNote(parentId) || {}).body || '')}"` : 'Moved back to your feed', 'Undo', () => moveNote(note, prev));
}

async function openParent(parentId) {
  setFilter({});
  state.expanded.add(parentId);
  await loadChildren(parentId);
  rerender();
  setTimeout(() => document.querySelector(`#feed [data-id="${parentId}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400);
}

function openMovePicker(note) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-label="Move into a note">
    <h2>Move into…<span class="spacer"></span><button class="tool" data-pick-close aria-label="Close">✕</button></h2>
    <p class="help" style="margin:4px 0 10px;color:var(--muted);font-size:13px">Pick the note this one should live inside. It will leave your main feed and show under that note.</p>
    <input class="field" id="pick-q" placeholder="Search your notes…" autocomplete="off">
    <div class="picker-list" id="pick-list"></div>
  </div>`;
  document.body.appendChild(back);
  const close = () => back.remove();
  const load = async () => {
    const qtext = back.querySelector('#pick-q').value.trim();
    let q = sb.from('notes').select('id,body').is('parent_id', null).is('archived_at', null).neq('id', note.id).order('updated_at', { ascending: false }).limit(30);
    if (qtext) q = q.ilike('body', `%${qtext.replace(/[%_\\]/g, '\\$&')}%`);
    const { data } = await q;
    back.querySelector('#pick-list').innerHTML = (data || []).map((p) => `<button data-pick="${p.id}">${esc(firstLine(p.body) || '(empty note)')}</button>`).join('') || '<p style="color:var(--muted)">No notes found.</p>';
  };
  let t; back.querySelector('#pick-q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(load, 200); });
  back.addEventListener('click', (e) => {
    if (e.target === back || e.target.closest('[data-pick-close]')) { close(); return; }
    const p = e.target.closest('[data-pick]');
    if (p) { close(); moveNote(note, p.dataset.pick); }
  });
  load();
  back.querySelector('#pick-q').focus();
}

function deleteNote(note) {
  const idx = state.notes.findIndex((n) => n.id === note.id);
  state.notes = state.notes.filter((n) => n.id !== note.id); renderFeed();
  for (const k in state.boardNotes) state.boardNotes[k] = state.boardNotes[k].filter((n) => n.id !== note.id);
  for (const k in state.children) state.children[k] = state.children[k].filter((n) => n.id !== note.id);
  if (state.view === 'board') renderBoard(); else rerender();
  let undone = false;
  const del = sb.from('notes').delete().eq('id', note.id);
  del.then(({ error }) => { if (error) { toast('Couldn\'t delete: ' + error.message); loadNotes(true); } else scheduleTagRefresh(); });
  toast('Note deleted', 'Undo', async () => {
    undone = true;
    await del;
    const { _queued, ...row } = note;
    const { data, error } = await sb.from('notes').insert({ id: row.id, body: row.body, tags: row.tags, source: row.source, pinned: row.pinned, attachments: row.attachments, archived_at: row.archived_at ?? null, parent_id: row.parent_id ?? null, created_at: row.created_at }).select().single();
    if (error) { toast('Couldn\'t restore: ' + error.message); return; }
    state.notes.splice(Math.max(0, idx), 0, data); renderFeed(); scheduleTagRefresh();
    if (state.view === 'board') loadBoard();
  }, 7000);
  // Files are removed only after the undo window closes
  setTimeout(() => {
    if (undone || !(note.attachments || []).length) return;
    sb.storage.from(BUCKET).remove(note.attachments.map((a) => a.path));
  }, 7500);
}

function openLightbox(src) {

  document.body.appendChild(el);
}

async function exportNotes() {
  const all = []; let from = 0;
  for (;;) {
    const { data, error } = await sb.from('notes').select(NOTE_SELECT).order('created_at').range(from, from + 999);
    if (error) { toast('Export failed: ' + error.message); return; }
    all.push(...data); if (data.length < 1000) break; from += 1000;
  }
  const { data: reminders } = await sb.from('reminders').select('*').order('due_at');
  const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), notes: all, reminders }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `brainfeed-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${all.length} notes`);
}

async function loadBoard() {
  const cols = state.settings?.board_tags || [];
  if (cols.length < 2) { state.boardPicking = true; state.pickTags = [...cols]; renderBoard(); return; }
  const results = await Promise.all(cols.map((t) => sb.from('notes').select('id,body,tags,source,pinned,attachments,created_at').contains('tags', [t]).is('archived_at', null).order('pinned', { ascending: false }).order('created_at', { ascending: false }).limit(100)));
  cols.forEach((t, i) => { state.boardNotes[t] = results[i].data || []; });
  renderBoard();
}

function renderBoard() {
  const el = $('#view-board');
  const cols = state.settings?.board_tags || [];
  let html = `<div class="board-head"><h2>Board</h2><span class="spacer" style="flex:1"></span>${state.boardPicking ? '' : '<button class="btn ghost small" data-board="edit">Change columns</button>'}</div>`;
  if (state.boardPicking) {
    html += `<div class="board-picker"><p>Choose 2–5 tags to become columns. Notes with that tag show up in the column, and anything you add there gets the tag.</p>
      <div class="chips">${state.tags.length ? state.tags.map((t) => `<button class="chip${state.pickTags.includes(t.tag) ? ' on' : ''}" data-pick="${esc(t.tag)}">#${esc(t.tag)} <span style="opacity:.6">${t.count}</span></button>`).join('') : '<span style="color:var(--muted)">No tags yet. Add some #tags to notes first.</span>'}</div>
      <button class="btn small" data-board="save" ${state.pickTags.length < 2 ? 'disabled' : ''}>Save columns (${state.pickTags.length}/5)</button>
      ${cols.length >= 2 ? '<button class="btn ghost small" data-board="cancel">Cancel</button>' : ''}</div>`;
  } else {
    html += '<div class="board">' + cols.map((t) => {
      const notes = state.boardNotes[t] || [];
      return `<div class="column"><h4>#${esc(t)} <span>${notes.length}</span></h4>
        <input class="field quick" data-quickadd="${esc(t)}" placeholder="Add to #${esc(t)}…">
        <div class="column-list">${notes.map((n) => noteHtml(n, true)).join('') || '<div class="empty" style="padding:24px 8px">Empty</div>'}</div></div>`;
    }).join('') + '</div>';
  }
  withAddFocus(() => { el.innerHTML = html; });
  hydrateAttachments(el);
}

$('#view-board').addEventListener('click', async (e) => {
  const pick = e.target.closest('[data-pick]');
  if (pick) {
    const t = pick.dataset.pick, i = state.pickTags.indexOf(t);
    if (i >= 0) state.pickTags.splice(i, 1); else if (state.pickTags.length < 5) state.pickTags.push(t); else toast('Up to 5 columns');
    renderBoard(); return;
  }
  const b = e.target.closest('[data-board]')?.dataset.board;
  if (b === 'edit') { state.boardPicking = true; state.pickTags = [...(state.settings.board_tags || [])]; renderBoard(); }
  else if (b === 'cancel') { state.boardPicking = false; renderBoard(); }
  else if (b === 'save') {
    const { data, error } = await sb.from('settings').update({ board_tags: state.pickTags, updated_at: new Date().toISOString() }).eq('user_id', state.user.id).select().single();
    if (error) { toast('Couldn\'t save columns: ' + error.message); return; }
    state.settings = data; state.boardPicking = false; loadBoard();
  }
});
$('#view-board').addEventListener('keydown', async (e) => {
  const t = e.target.dataset?.quickadd;
  if (!t || e.key !== 'Enter' || e.isComposing) return;
  const v = e.target.value.trim(); if (!v) return;
  e.target.value = '';
  const body = new RegExp(`(^|\\s)#${t}(\\b|$)`, 'i').test(v) ? v : `${v} #${t}`;
  await addNote(body);
  loadBoard();
});

async function loadAgents() {
  const { data } = await sb.from('api_tokens').select('id,name,token_hash,created_at,last_used_at,revoked_at').order('created_at', { ascending: false });
  state.agents = data || [];
